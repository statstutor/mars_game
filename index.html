<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make Mars Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a floating isometric diorama of Mars fills the screen; HUD cards float over space at the edges. */
:root {
  --space: #120e2b;
  --panel: rgba(32, 23, 72, 0.8);
  --panel-solid: #1f1747;
  --line: rgba(255, 255, 255, 0.1);
  --ink: #fff6ec;
  --muted: #b8afd8;
  --mars: #ff7a45;
  --sky: #5cc8ff;
  --leaf: #5fd38d;
  --warn: #ff5d73;
  --sun: #ffd166;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--space); color: var(--ink); font-family: var(--body); font-size: 14px; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.card { pointer-events: auto; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px; }

#goals { width: 290px; max-width: 100%; padding: 12px 14px; }
#goals summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
#goals summary::-webkit-details-marker { display: none; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mars); }
#goals h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 21px; text-wrap: balance; }
#goal-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
#goal-list li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
#goal-list .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
#goal-list li.done .dot { background: var(--leaf); border-color: var(--leaf); }
#goal-list li.done .dot::after { content: ''; width: 6px; height: 3px; border: solid #123; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
#goal-list li.done span:nth-child(2) { color: var(--muted); }
#goal-list .pv { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
#goal-list li.done .pv { color: var(--leaf); }

.stats { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: 660px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .2s, background .2s; }
.chip .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.chip .ic svg { width: 16px; height: 16px; fill: #1a1238; }
.chip .tx { display: flex; flex-direction: column; line-height: 1.1; }
.chip b { font-family: var(--display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3.4em; display: inline-block; }
.chip small { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip small.neg { color: var(--warn); }
.chip small.pos { color: var(--leaf); }
.chip.warn { border-color: var(--warn); background: rgba(120, 25, 50, 0.75); }
.chip.planet b { color: var(--ink); }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
#tip { pointer-events: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; font-size: 13px; line-height: 1.45; z-index: 2; }
#tip strong { font-family: var(--display); font-weight: 600; font-size: 15px; display: block; }
#tip .bad { color: var(--warn); font-weight: 800; }
#tip .muted { color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: stretch; max-width: 100%; pointer-events: none; }
.toolbar { pointer-events: auto; display: flex; gap: 4px; overflow-x: auto; padding: 6px; min-width: 0; scrollbar-width: thin; }
.tool { flex: 0 0 auto; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px 7px; border-radius: 13px; background: transparent; border: 2px solid transparent; color: var(--ink); cursor: pointer; font: inherit; position: relative; transition: background .15s, transform .15s; }
.tool:hover { background: rgba(255, 255, 255, 0.07); }
.tool:focus-visible, .ctl:focus-visible, .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tool.on { background: rgba(255, 122, 69, 0.2); border-color: var(--mars); }
.tool canvas { width: 58px; height: 46px; }
.tool .nm { font-family: var(--display); font-size: 12.5px; font-weight: 500; line-height: 1.1; text-align: center; }
.tool .cost { font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.2; text-align: center; }
.tool.poor .cost { color: var(--warn); }
.tool kbd { position: absolute; top: 4px; left: 7px; font: 700 10px var(--body); color: var(--muted); }
.tool .cd { position: absolute; inset: 0; border-radius: 11px; background: rgba(18, 14, 43, 0.7); display: grid; place-items: center; font: 600 18px var(--display); }
.controls { pointer-events: auto; display: grid; grid-template-columns: repeat(2, 40px); gap: 4px; padding: 6px; align-content: center; }
.ctl { width: 40px; height: 34px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, 0.07); color: var(--ink); font: 600 13px var(--display); cursor: pointer; }
.ctl:hover { background: rgba(255, 255, 255, 0.14); }
.ctl.on { background: var(--mars); color: #24102a; }
.ctl svg { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }
.ctl.off { position: relative; color: var(--muted); }
.ctl.off::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--warn); transform: rotate(-40deg); border-radius: 2px; }

#toasts { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 5; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 13px; text-align: center; animation: pop .25s ease-out; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.toast.good { background: #1d5a43; }
.toast.bad { background: #6b1f37; }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .4s; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12, 7, 32, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; z-index: 10; }
.sheet { width: min(540px, 100%); max-height: 100%; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); animation: pop .35s ease-out; }
.sheet h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 9vw, 58px); line-height: .95; letter-spacing: -0.01em; text-wrap: balance; }
.sheet h1 .m { color: var(--mars); }
.sheet h1 .b { color: var(--sky); }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.55; font-size: 15px; color: #e9e2f7; max-width: 62ch; }
.sheet .fact { background: rgba(92, 200, 255, 0.1); border-left: 0; border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.sheet .fact b { color: var(--sky); }
.levels { display: grid; gap: 10px; }
.lvl { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--ink); cursor: pointer; font: inherit; }
.lvl:hover { border-color: var(--mars); background: rgba(255, 122, 69, 0.1); }
.lvl:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.lvl .n { width: 40px; height: 40px; border-radius: 50%; background: var(--mars); color: #24102a; display: grid; place-items: center; font: 700 20px var(--display); }
.lvl.two .n { background: var(--sky); }
.lvl b { font: 600 18px var(--display); display: block; }
.lvl small { color: var(--muted); font-size: 13px; }
.lvl .go { font: 600 14px var(--display); color: var(--mars); }
.lvl.two .go { color: var(--sky); }
.lvl.three .n { background: var(--leaf); }
.lvl.three .go { color: var(--leaf); }
.lvl.four .n { background: #ffd166; } .lvl.four .go { color: #ffd166; }
.lvl.five .n { background: #c9a7ff; } .lvl.five .go { color: #c9a7ff; }
.lvl.six .n { background: #ff9fb1; } .lvl.six .go { color: #ff9fb1; }
.lvl.seven .n { background: #b5aeb0; } .lvl.seven .go { color: #d6d0d2; }
.levels { max-height: 46vh; overflow-y: auto; }
.lvl.cont { border-color: var(--leaf); background: rgba(95, 211, 141, 0.1); }
.lvl.cont:hover { border-color: var(--leaf); background: rgba(95, 211, 141, 0.18); }
.lvl.cont .n { background: var(--leaf); font-size: 16px; }
.lvl.cont .go { color: var(--leaf); }
#talk { position: fixed; left: 16px; bottom: 200px; z-index: 9; width: min(410px, calc(100% - 32px)); display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: start; padding: 12px 14px 13px; cursor: pointer; animation: pop .25s ease-out; }
#talk canvas { width: 60px; height: 60px; display: block; }
#talk .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-right: 44px; }
#talk .who b { font: 600 16px var(--display); }
#talk .who small { font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
#talk p { margin: 3px 0 0; font-size: 14px; line-height: 1.45; min-height: 2.9em; }
#talk .skip { position: absolute; right: 8px; top: 8px; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--muted); font: 700 11px var(--body); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
#talk .skip:hover { color: var(--ink); }
#talk .skip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.chip.needs { display: grid; grid-template-columns: auto 46px; gap: 2px 6px; align-items: center; padding: 5px 12px; border-radius: 16px; }
.chip.needs span { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--leaf); transition: width .3s, background .3s; }
.trader { display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: center; }
.trader canvas { width: 60px; height: 60px; }
.trader p { font-size: 14px; }
.offers { display: grid; gap: 8px; }
.offer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: rgba(182, 243, 106, 0.06); color: var(--ink); font: inherit; cursor: pointer; }
.offer:hover:not(:disabled) { border-color: #b6f36a; background: rgba(182, 243, 106, 0.14); }
.offer:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.offer:disabled { opacity: 0.45; cursor: not-allowed; }
.offer .arrow { color: #b6f36a; font: 600 18px var(--display); }
.offer .get { font-weight: 800; }
.small-note { font-size: 12.5px !important; color: var(--muted) !important; }
.friend { font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hearts { color: #ff6b9d; letter-spacing: 2px; font-size: 17px; }
.hearts i { color: rgba(255, 255, 255, 0.18); font-style: normal; }
.friend small { color: var(--muted); }
.btn.visit { background: #b6f36a; color: #1a2410; width: 100%; }
.offer.gold { border-color: #ffd166; background: rgba(255, 209, 102, 0.12); }
.perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.perk { text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: rgba(182, 243, 106, 0.06); color: var(--ink); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.perk b { font: 600 15px var(--display); }
.perk small { color: var(--muted); font-size: 12.5px; }
.perk:hover, .perk.on { border-color: #b6f36a; background: rgba(182, 243, 106, 0.16); }
.perk:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.lvl.bonus .n { background: #b6f36a; font-size: 16px; } .lvl.bonus .go { color: #b6f36a; } .lvl.bonus { border-color: rgba(182, 243, 106, 0.5); }
.sheet.wide { width: min(1000px, 100%); }
.dest { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.world { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); border: 2px solid var(--line); }
.world canvas { width: 72px; height: 72px; }
.world b { font: 600 20px var(--display); }
.world .stars { color: var(--sun); letter-spacing: 2px; }
.world small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.world .tag { margin-top: auto; font: 600 13px var(--display); color: var(--muted); padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); }
.world .btn { margin-top: auto; }
.world.soon { opacity: 0.75; }
.tree { display: grid; gap: 14px; }
.branch h3 { margin: 0 0 6px; font: 600 15px var(--display); letter-spacing: 0.03em; }
.nodes { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.nodes .arrow { align-self: center; color: var(--muted); font: 600 16px var(--display); }
.tech { flex: 0 0 170px; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--ink); font: inherit; cursor: default; }
.tech b { font: 600 14px var(--display); }
.tech small { font-size: 11.5px; line-height: 1.35; color: var(--muted); }
.tech .cost { margin-top: auto; font-size: 11.5px; font-weight: 800; color: var(--muted); }
.tech.owned { border-color: var(--leaf); background: rgba(95, 211, 141, 0.12); }
.tech.owned .cost { color: var(--leaf); }
.tech.ready { border-color: var(--sun); background: rgba(255, 209, 102, 0.1); cursor: pointer; }
.tech.ready .cost { color: var(--sun); }
.tech.ready:hover { background: rgba(255, 209, 102, 0.2); }
.tech.ready:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tech.locked { opacity: 0.5; }
.chip.clicky { cursor: pointer; }
.chip.clicky:hover { border-color: var(--sky); }
.chip.pulse { border-color: var(--sun); box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.25); }
.chip.clicky:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#layers { pointer-events: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px; justify-content: center; }
#layers button { border: 0; border-radius: 10px; padding: 6px 10px; background: rgba(255, 255, 255, 0.07); color: var(--ink); font: 600 12px var(--display); cursor: pointer; white-space: nowrap; }
#layers button.on { background: var(--sky); color: #10203a; }
#layers button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#goal-list li.path { display: block; font: 600 12px var(--display); color: var(--sky); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 4px; }
#goal-list li.or { display: block; text-align: center; color: var(--muted); font-size: 11px; }
#saved { margin: 10px 0 0; font-size: 11px; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font: 600 16px var(--display); cursor: pointer; background: var(--mars); color: #24102a; }
.btn.alt { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
.btn:hover { filter: brightness(1.08); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.how div { background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 10px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.how b { display: block; color: var(--ink); font: 600 14px var(--display); }

@media (max-width: 720px) {
  #goals { width: 100%; padding: 10px 12px; }
  #goals h2 { font-size: 18px; }
  .stats { justify-content: flex-start; max-width: 100%; }
  .group { justify-content: flex-start; }
  .chip { padding: 3px 9px 3px 3px; gap: 6px; }
  .chip .ic { width: 22px; height: 22px; }
  .chip .ic svg { width: 13px; height: 13px; }
  .chip b { font-size: 13px; }
  .chip small { font-size: 10px; }
  .tool { width: 66px; padding: 4px 2px 5px; }
  #tip.idle, #chip-o2 { display: none; }
  .chip.needs { padding: 3px 9px; }
  .tool canvas { width: 44px; height: 35px; }
  .tool .nm { font-size: 11px; }
  .tool kbd { display: none; }
  #tip { font-size: 12px; padding: 8px 12px; }
  #talk { grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 12px; }
  #talk canvas { width: 44px; height: 44px; }
  #talk p { font-size: 13px; }
  .how { grid-template-columns: 1fr; }
  .sheet { padding: 22px 18px; border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .sheet { animation: none; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Isometric map of the Martian surface. Pick a building below, then click a tile to place it."></canvas>

<div id="ui">
  <header class="top">
    <details id="goals" class="card" open>
      <summary>
        <span class="eyebrow" id="lvl-eyebrow">Level 1 · Sol 1</span>
        <h2 id="lvl-name">Touchdown</h2>
      </summary>
      <ul id="goal-list"></ul>
      <p id="saved">Progress saves automatically</p>
    </details>
    <div class="stats">
      <div class="group" aria-label="Colony">
        <div class="chip" id="chip-energy" title="Energy (stored / capacity)">
          <span class="ic" style="background:var(--sun)"><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5h6l-1 8.5 9-11.5h-6z"/></svg></span>
          <span class="tx"><b id="v-energy">0</b><small id="r-energy">+0/s</small></span>
        </div>
        <div class="chip" title="Metal">
          <span class="ic" style="background:#b39cff"><svg viewBox="0 0 24 24"><path d="M12 2.5 3.5 7.2v9.6l8.5 4.7 8.5-4.7V7.2z"/></svg></span>
          <span class="tx"><b id="v-metal">0</b><small id="r-metal">+0/s</small></span>
        </div>
        <div class="chip" title="Water">
          <span class="ic" style="background:var(--sky)"><svg viewBox="0 0 24 24"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg></span>
          <span class="tx"><b id="v-water">0</b><small id="r-water">+0/s</small></span>
        </div>
        <div class="chip" title="Food">
          <span class="ic" style="background:#f0b35c"><svg viewBox="0 0 24 24"><path d="M12 8.2c-1.6-1.2-4.4-1.6-6.2.3C3.6 10.9 4.4 16 6.6 18.8c1.6 2 3.2 2.6 5.4 1.6 2.2 1 3.8.4 5.4-1.6 2.2-2.8 3-7.9.8-10.3-1.8-1.9-4.6-1.5-6.2-.3z"/><path d="M12.6 7.6c.2-2.4 1.6-4 3.9-4.6-.2 2.4-1.6 4-3.9 4.6z"/></svg></span>
          <span class="tx"><b id="v-food">0</b><small id="r-food">+0/s</small></span>
        </div>
        <div class="chip clicky" id="chip-science" title="Science: click (or press R) to open the tech tree" role="button" tabindex="0" hidden>
          <span class="ic" style="background:var(--sky)"><svg viewBox="0 0 24 24"><path d="M9 2.5h6v2h-1v5.2l5.3 8.6A2.5 2.5 0 0 1 17.2 22H6.8a2.5 2.5 0 0 1-2.1-3.7L10 9.7V4.5H9z"/></svg></span>
          <span class="tx"><b id="v-science">0</b><small id="r-science">Research ›</small></span>
        </div>
        <div class="chip" id="chip-fuel" title="Rocket fuel" hidden>
          <span class="ic" style="background:#ffd166"><svg viewBox="0 0 24 24"><path d="M12 2c3 3.5 5 7 5 10.5a5 5 0 0 1-10 0C7 9 9 5.5 12 2z"/></svg></span>

const shade = (a, t) => t > 0 ? mix(a, '#ffffff', t) : mix(a, '#000000', -t);

const lp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];

function showTree() {
  const rows = BRANCHES.map(([br, name, col]) => {
    const nodes = TECHS.filter(t => t.br === br).map(t => {
      const owned = hasTech(t.id), open = canResearch(t), afford = S.science >= t.cost;
      const state = owned ? 'owned' : open ? (afford ? 'ready' : 'open') : 'locked';
      const needs = t.req.filter(r => !hasTech(r)).map(r => TECH[r].name);
      return `<button class="tech ${state}" data-id="${t.id}" ${state === 'ready' ? '' : 'aria-disabled="true"'}>
        <b>${t.name}</b><small>${t.desc}</small>
        <span class="cost">${owned ? 'Researched' : needs.length ? 'Needs ' + needs.join(' + ') : `${t.cost} science`}</span></button>`;
    }).join('<span class="arrow" aria-hidden="true">→</span>');
    return `<div class="branch"><h3 style="color:${col}">${name}</h3><div class="nodes">${nodes}</div></div>`;
  }).join('');
  openModal(`
    <span class="eyebrow" style="color:var(--sky)">Research</span>
    <h2>Tech tree</h2>
    <p class="small-note">You have <b style="color:var(--ink)">${Math.floor(S.science)} science</b>. Research labs make more. Pick any path you like; what you learn carries into the next level.</p>
    <div class="tree">${rows}</div>
    <div class="row"><button class="btn alt" id="tree-close">Back to the colony</button></div>`, true);
  $('#tree-close').addEventListener('click', closeModal);
  $('#modal').querySelectorAll('.tech.ready').forEach(b => b.addEventListener('click', () => { learn(b.dataset.id); showTree(); }));
}

  for (const [mx, my, mr] of m.mountains) for (const t of tiles) {

  }

  for (const [fx_, fy] of m.frost || []) { const t = T(fx_, fy); t.type = 'ice'; t.h = 1; }
  for (const [rx, ry] of m.ruins) { const t = T(rx, ry); t.type = 'ruin'; t.h = Math.max(1, Math.min(t.h, 2)); }

function tick(dt) {

    }
  }

  if (S.planet.temp >= -10 && !L.offworld) say('kip', 'The snow on the mountains is melting. Fun fact: it was mostly frozen carbon dioxide, so now it is more atmosphere!', 'snow');
  if (S.planet.press >= 4 && !L.offworld) say('kip', 'Look up! Those are clouds. Real clouds, on Mars! I am taking several hundred photos.', 'clouds');

  // lichen

  if (canGrow && S.level === 1 && !L.offworld) say('bot', 'It’s warm enough and the air is thick enough for lichen now. Get a seeder down!', 'lichen-ok');
  if (canGrow) {
    const open = t => t && !t.b && (t.type === 'plain' || t.type === 'ore');

      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const n = tileAt(t.gx + dx, t.gy + dy);
        if (open(n)) n.lichen = Math.min(1, n.lichen + 0.05 * eff * dt);
      }
    }
    for (const t of S.tiles) if (t.lichen >= 0.6) {
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = tileAt(t.gx + dx, t.gy + dy);
        if (open(n)) n.lichen = Math.min(1, n.lichen + 0.012 * dt);
      }
    }
  }
  S.planet.o2 = Math.min(21, S.planet.o2 + lichenTiles() * 0.0006 * dt);

  // goals
  L.goals.forEach((g, i) => {

      toast('Done: ' + g.text, 'good'); sfx('chime');
      let j = L.goals.findIndex((h, k) => !S.goalsDone[k] && h.path === g.path);
      if (j < 0) j = L.goals.findIndex((_, k) => !S.goalsDone[k]);
      if (j >= 0) { const n = L.goals[j]; say(n.who, PRAISE[n.who] + ' ' + n.hint, `hint-${S.level}-${j}`); }
    }
  });
  // nudge with the next objective when nothing has happened for a while
  if (!S.won && S.time - S.lastProgress > 55 && S.time - S.lastNudge > 70 && !talking && !talkQ.length) {
    S.lastNudge = S.time;
    const j = L.goals.findIndex((_, k) => !S.goalsDone[k]);
    if (j >= 0) say(L.goals[j].who, L.goals[j].hint);
  }
  const pathDone = L.paths ? L.paths.findIndex((_, pi) => L.goals.every((h, i) => h.path !== pi || S.goalsDone[i])) : (S.goalsDone.every(Boolean) ? 0 : -1);
  if (!S.won && pathDone >= 0) {
    S.won = true; S.winPath = pathDone;
    if (LEVELS[S.level + 1] && LEVELS[S.level + 1].research) try { localStorage.setItem('mmb-techs-' + (S.level + 1), JSON.stringify(S.techs)); } catch (e) {}
    try { localStorage.setItem('mmb-best', String(Math.max(S.level + 1, +localStorage.getItem('mmb-best') || 0))); } catch (e) {}
    saveGame();
    setTimeout(showComplete, 1400);
  }
}

// ---------------------------------------------------------------- day & night (level 3)
const DAY = 75, NIGHT = 35;
function dayNight(dt) {
  S.clock += dt;
  const night = S.clock % (DAY + NIGHT) >= DAY;
  if (night && !S.night) {
    S.night = true;
    S.wave = Math.min(16, (LEVELS[S.level].waveBase || 4) + S.nights * 3); S.waveT = 2;
    toast('Night is falling. Critters incoming!', 'bad');
    say('kip', 'Night is falling. Critter activity rising. I recommend zappers, and maybe a snack.', 'night1');
  } else if (!night && S.night) {
    S.night = false; S.nights++;
    toast('Dawn! The colony made it through the night.', 'good');
    say('cmd', 'We made it through the night. Good work, everyone.', 'dawn1');
  }
  if (S.night && S.wave > 0) {
    S.waveT -= dt;
    if (S.waveT <= 0) { if (spawnCritter()) S.wave--; S.waveT = 2.6; }
  }
}
// 0 at midday, 1 in the middle of the night, with a short dusk and dawn
function nightness() {
  if (!S || !LEVELS[S.level].dayNight) return 0;
  const ph = S.clock % (DAY + NIGHT);
  if (ph < DAY - 6) return 0;
  if (ph < DAY) return (ph - (DAY - 6)) / 6;
  if (ph > DAY + NIGHT - 6) return (DAY + NIGHT - ph) / 6;
  return 1;
}

// ---------------------------------------------------------------- water network
// A tower waters farms within 2 tiles. Pipes connected to a tower carry water further:
// a farm touching a wet pipe counts as watered. Towers need water in stock to work.
function updateWater() {
  for (const grid of [S.tiles, S.sky]) {
    if (!grid) continue;
    const n = Math.round(Math.sqrt(grid.length)), at = (x, y) => (x >= 0 && y >= 0 && x < n && y < n) ? grid[y * n + x] : null;
    for (const t of grid) { t.wet = false; t.flow = false; }
    if (S.water < 1) continue;
    const towers = grid.filter(t => t.b === 'tower' && !(t.off > 0));
    const queue = [...towers];
    for (const t of towers) t.flow = true;
    while (queue.length) {
      const t = queue.shift();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nb = at(t.gx + dx, t.gy + dy);
        if (nb && nb.b === 'pipe' && !nb.flow) { nb.flow = true; queue.push(nb); }
      }
    }
    for (const t of grid) {
      if (!FARMS.includes(t.b)) continue;
      if (towers.some(w => Math.max(Math.abs(w.gx - t.gx), Math.abs(w.gy - t.gy)) <= 2)) { t.wet = true; continue; }
      t.wet = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const nb = at(t.gx + dx, t.gy + dy); return nb && nb.b === 'pipe' && nb.flow; });
    }
  }
}

// ---------------------------------------------------------------- land reclamation and new layers
function ringTile(gx, gy, r, layer) {
  const t = { gx, gy, type: 'plain', h: 1, b: null, born: -9, v: r(), lichen: 0, basin: false };
  if (layer === 'under') t.type = 'wall', t.h = 2, t.layer = 'under';
  else if (layer === 'sky') t.type = 'void', t.layer = 'sky';
  else {
    const L = LEVELS[S.level], x = r();
    if (x < 0.14) t.type = 'ore';
    else if (x < 0.19) { t.type = L.map.wet ? 'lake' : 'crater'; t.h = 0; t.basin = true; }
    else if (x < 0.25) { t.type = 'rock'; t.h = 3; }
    else if (x < 0.27) t.type = 'ruin';
    if (L.map.lichen && (t.type === 'plain' || t.type === 'ore') && r() < 0.45) t.lichen = 0.6 + r() * 0.4;

}
function growGrid(grid, n, layer, r) {
  const m = n + 2, out = [];

    const ox = gx - 1, oy = gy - 1;
    if (ox >= 0 && oy >= 0 && ox < n && oy < n) { const t = grid[oy * n + ox]; t.gx = gx; t.gy = gy; out.push(t); }
    else out.push(ringTile(gx, gy, r, layer));
  }
  return out;
}

  const n = S.n || 11, r = rng(S.time * 1000 + n);
  const critTargets = crits.map(c => S.tiles[c.ti]);
  const traderTile = S.trader ? S.tiles[S.trader.i] : null;
  S.tiles = growGrid(S.tiles, n, 'surface', r);
  if (S.under) S.under = growGrid(S.under, n, 'under', r);
  if (S.sky) S.sky = growGrid(S.sky, n, 'sky', r);
  S.n = N = n + 2;
  crits.forEach((c, i) => { c.x++; c.y++; c.hx++; c.hy++; c.ti = S.tiles.indexOf(critTargets[i]); });
  if (traderTile) S.trader.i = S.tiles.indexOf(traderTile);
  if (S.boss) { S.boss.x++; S.boss.y++; }

}
function makeUnder() {
  const n = S.n || N, r = rng(n * 7919 + S.level);

      const t = at(x, y); t.type = 'cave'; t.h = 1;
      const d = [[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(r() * 4)];
      x = clamp(x + d[0], 1, n - 2); y = clamp(y + d[1], 1, n - 2);

}
function makeSky() {

// ---------------------------------------------------------------- critters
// Small native creatures. They climb out of craters, walk to a building, switch it off while
// they nibble, and run home with whatever they stole. Bonking one gets the loot back.
const LOOT = { greenhouse: 'food', restaurant: 'food', cafe: 'food', drill: 'water', park: 'water', coop: 'food', ranch: 'food', fishery: 'food', tower: 'water', fuel: 'fuel', lab: 'science' };
// hp: bonks needed. spd: speed multiplier. size: drawing scale. steal: how fast it takes supplies.
const KINDS = {
  basic:  { hp: 1, spd: 1,    size: 1,    steal: 1 },
  armor:  { hp: 2, spd: 0.85, size: 1.05, steal: 1 },
  zippy:  { hp: 1, spd: 1.7,  size: 0.85, steal: 0.7 },
  sneaky: { hp: 2, spd: 1,    size: 1,    steal: 1.2 },
  brute:  { hp: 4, spd: 0.6,  size: 1.55, steal: 2.2 },
};
const KIND_LINES = {
  armor: ['eng', 'Careful, that one has a shell. Armoured critters need two bonks.'],
  zippy: ['kip', 'Whoa, that critter is fast! It is a zippy one. Tap quickly!'],
  sneaky: ['kip', 'I can barely see that one. Sneaky critters are almost invisible until they get close to a building.'],
  brute: ['eng', 'That is a big one. Brutes take four bonks and steal a lot. Get the zappers on it!'],
};
function pickKind() {
  const mix = (LEVELS[S.level].critters || {}).mix || { basic: 1 };
  let r = Math.random() * Object.values(mix).reduce((a, b) => a + b, 0);
  for (const [k, w] of Object.entries(mix)) { r -= w; if (r <= 0) return k; }
  return 'basic';
}
function spawnCritter(kind = pickKind(), from = null) {
  const targets = S.tiles.filter(t => t.b && t.b !== 'zapper');
  if (!targets.length) return false;
  const homes = S.tiles.filter(t => t.type === 'crater' || t.type === 'frozen' || (t.basin && t.type === 'lake'));
  let hx, hy;
  if (from) { hx = from.gx + 0.5; hy = from.gy + 0.5; }
  else if (homes.length) { const h = homes[Math.floor(Math.random() * homes.length)]; hx = h.gx + 0.5; hy = h.gy + 0.5; }
  else { const e = Math.random() * N; [hx, hy] = Math.random() < 0.5 ? [e, N - 0.3] : [N - 0.3, e]; }
  const tgt = targets[Math.floor(Math.random() * targets.length)];
  const K = KINDS[kind];
  const col = kind === 'brute' ? '#e0607e' : kind === 'zippy' ? '#ffd166' : kind === 'sneaky' ? '#9fe7ff' : Math.random() < 0.5 ? '#7fe0c4' : '#b79bff';
  crits.push({ x: hx, y: hy, hx, hy, ti: S.tiles.indexOf(tgt), state: 'emerge', t: 0, loot: {}, face: 1,
               kind, hp: K.hp, maxhp: K.hp, hit: 0, col, seed: Math.random() * 10 });
  if (KIND_LINES[kind]) say(KIND_LINES[kind][0], KIND_LINES[kind][1], 'kind-' + kind);
  const first = [
    ['kip', 'Uh oh. Something just climbed out of that crater, and it looks hungry. Quick, tap it to bonk it!'],
    ['kip', 'The critters are back, and there are more of them this time. Remember, tap to bonk!'],
    ['eng', 'Critters spotted near the craters. Bonk them, or let the zappers handle it.'],
  ][S.level];
  if (first) say(first[0], first[1], 'crit1-' + S.level);
  return true;
}
function critTile(c) { return tileAt(clamp(Math.floor(c.x), 0, N - 1), clamp(Math.floor(c.y), 0, N - 1)); }
function critWorld(c) {
  const t = critTile(c);
  c.hs = c.hs == null ? t.h : c.hs + (t.h - c.hs) * 0.2;
  return { x: (c.x - c.y) * 32, y: (c.x + c.y) * 16 - c.hs * HZ };
}
function stepToward(c, tx, ty, dist) {
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);

function updateCritters(dt) {
  const L = LEVELS[S.level], cfg = L.critters;

  if (cfg && cfg.after()) {
    S.critT -= dt;
    const alive = crits.filter(c => c.state !== 'bonked').length;
    if (S.critT <= 0) {
      if (alive < cfg.max && !S.night) spawnCritter();
      S.critT = cfg.every[0] + Math.random() * (cfg.every[1] - cfg.every[0]);
    }
  }
  const base = cfg ? cfg.speed : 0.7;
  for (const c of crits) {
    c.t += dt; c.hit = Math.max(0, c.hit - dt);
    const K = KINDS[c.kind || 'basic'], speed = base * K.spd;
    const tgt = S.tiles[c.ti];
    if (!tgt) { c.gone = true; continue; }
    if (c.state === 'emerge') { if (c.t > 0.7) { c.state = 'walk'; c.t = 0; } }
    else if (c.state === 'walk') {
      if (!tgt.b) { c.state = 'flee'; c.t = 0; continue; }
      if (stepToward(c, tgt.gx + 0.5, tgt.gy + 0.5, speed * dt) < 0.25) { c.state = 'nibble'; c.t = 0; }
    } else if (c.state === 'nibble') {
      if (!tgt.b) { c.state = 'flee'; c.t = 0; continue; }
      tgt.off = Math.max(tgt.off || 0, 0.3);
      const key = LOOT[tgt.b] || 'metal';
      const amt = Math.min(S[key] || 0, 1.4 * K.steal * (S.techs && S.techs.includes('shields') ? 0.5 : 1) * dt);
      S[key] -= amt; c.loot[key] = (c.loot[key] || 0) + amt;
      if (c.t > (c.kind === 'brute' ? 10 : 7)) { c.state = 'flee'; c.t = 0; }
    } else if (c.state === 'flee') {
      if (stepToward(c, c.hx, c.hy, speed * 1.25 * dt) <= 0.05) {
        c.gone = true;
        const [k, v] = Object.entries(c.loot)[0] || [];
        if (v > 0.5) {
          toast(`A critter got away with ${Math.round(v)} ${k}!`, 'bad');
          say('eng', 'One of those critters just ran off with our supplies. Keep an eye on them!', 'escape1');

  }

  for (const t of S.tiles) {
    if ((t.b !== 'zapper' && t.b !== 'tesla') || t.off > 0) continue;
    t.cd = (t.cd || 0) - dt * S.eff * (S.bonus.zap || 1);
    if (t.cd > 0) continue;
    const tesla = t.b === 'tesla', arc = hasTech('arc');
    const range = tesla || arc ? 3.2 : 2.3, dmg = tesla || arc ? 2 : 1, chain = tesla ? 3 : PERK === 'tesla' ? 2 : 1;
    const prey = crits.filter(c => c.state !== 'bonked' && Math.hypot(c.x - (t.gx + 0.5), c.y - (t.gy + 0.5)) <= range).slice(0, chain);
    if (prey.length) {

        from = [b.x, b.y - 8];

    } else if (zapBoss(t, range) || zapCrasher(t, range, dmg)) t.cd = 1.4;

  for (const t of S.tiles) {
    if (t.b !== 'dronebay' || t.off > 0) continue;
    t.cd = (t.cd || 0) - dt * S.eff;
    if (t.cd > 0) continue;
    const near = (x, y) => Math.hypot(x - (t.gx + 0.5), y - (t.gy + 0.5)) <= 4.2;
    let target = crits.find(c => c.state !== 'bonked' && near(c.x, c.y));
    let nest = !target && S.tiles.find(o => o.type === 'nest' && near(o.gx + 0.5, o.gy + 0.5));
    let boss = !target && !nest && S.boss && S.boss.state !== 'dead' && S.boss.state !== 'burrow' && near(S.boss.x, S.boss.y);
    if (!target && !nest && !boss) continue;
    const a = center(t);
    const to = target ? (() => { const w = critWorld(target); return [w.x, w.y - 8]; })() : nest ? (() => { const c = center(nest); return [c.x, c.y - 4]; })() : [bossWorld().x, bossWorld().y - 30];
    fx.push({ kind: 'drone', x: a.x, y: a.y - 16, x0: a.x, y0: a.y - 16, x2: to[0], y2: to[1], life: 0.7, max: 0.7,
              hit: () => { if (target) bonk(target, true); else if (nest) hitNest(nest); else if (boss) hurtBoss(1); } });

function bonk(c, zapped = false, dmg = 1) {

function updateTrader(dt) {

    S.traderT -= dt;
    if (S.traderT <= 0) {
      const spots = S.tiles.filter(t => !t.b && (t.type === 'plain' || t.type === 'ore'));
      if (!spots.length) { S.traderT = 20; return; }
      const spot = spots[Math.floor(Math.random() * spots.length)];
      const pool = OFFERS.filter(o => !(o.once && S.bought.includes(o.id))).sort(() => Math.random() - 0.5).slice(0, 3);
      S.trader = { i: S.tiles.indexOf(spot), phase: 'arrive', p: 0, t: 50, offers: pool.map(o => o.id) };
      toast('A flying saucer is landing! Click it to trade.', 'good');
      sfx('saucer');

    }

  }

  else if (tr.phase === 'wait') { tr.t -= dt; if (tr.t <= 0) { tr.phase = 'leave'; tr.p = 0; } }
  else if (tr.phase === 'leave') { tr.p += dt / 2.5; if (tr.p >= 1) { S.trader = null; S.traderT = 70 + Math.random() * 30; } }
}
function saucerWorld() {

function showTrade() {
  const tr = S.trader;
  if (!tr) return;
  const offers = tr.offers.map(id => OFFERS.find(o => o.id === id)).filter(Boolean);
  const invite = HEARTS >= 10 && !LEVELS[S.level].bonus;
  openModal(`
    <span class="eyebrow" style="color:#b6f36a">Alien trader</span>
    <div class="trader"><canvas id="zorp-face" width="120" height="120"></canvas><div><h2>Zorp’s Wares</h2><p>“Zorp gives good deals. Mostly.” Pick one trade.</p></div></div>
    <p class="friend">Zorp’s friendship ${heartRow()} <small>${HEARTS}/10</small></p>
    ${invite ? '<button class="btn visit" id="visit">Hop in the saucer: visit Zorp’s home planet!</button>' : ''}
    ${GOLD > 0 ? `<button class="offer gold" id="gift"><span class="give">Give <b>a Golden Crystal</b></span><span class="arrow">→</span><span class="get">+3 friendship (you have ${GOLD})</span></button>` : ''}
    <div class="offers">${offers.map(o => `<button class="offer" data-id="${o.id}" ${afford(o.give) ? '' : 'disabled'}>
      <span class="give">Give <b>${costText(o.give)}</b></span><span class="arrow">→</span><span class="get">${o.get}</span></button>`).join('')}</div>
    <p class="small-note">You have ${Math.floor(S.crystals)} crystals, ${Math.floor(S.food)} food, ${Math.floor(S.water)} water. Bonk critters to collect crystals.</p>
    <div class="row"><button class="btn alt" id="later">Maybe later</button></div>`);
  const g = $('#zorp-face').getContext('2d'); g.scale(2, 2); drawPortrait(g, 'zorp', false, false);
  $('#later').addEventListener('click', closeModal);
  if (invite) $('#visit').addEventListener('click', goGlorp);
  if (GOLD > 0) $('#gift').addEventListener('click', () => {
    GOLD--; store.set('mmb-gold', GOLD); sfx('relic');
    addHearts(3);
    say('zorp', 'A golden crystal! For Zorp? Zorp is so happy, all three eyes are crying.', 'gift1');
    showTrade();
  });
  $('#modal').querySelectorAll('.offer[data-id]').forEach(b => b.addEventListener('click', () => {
    const o = OFFERS.find(x => x.id === b.dataset.id);
    if (!afford(o.give)) return;
    for (const [k, v] of Object.entries(o.give)) S[k] -= v;
    o.apply(S); if (o.once) S.bought.push(o.id);
    S.trades++; dirty = true;
    tr.phase = 'leave'; tr.p = 0;
    closeModal();
    toast('Traded: ' + o.get, 'good'); sfx('chime');
    say('zorp', 'Pleasure doing business! Zorp will return. Zorp always returns.', 'trade1');
    addHearts(1);
  }));
}

// ---------------------------------------------------------------- actions
const afford = c => Object.entries(c).every(([k, v]) => S[k] >= v);
const costText = c => {
  const e = Object.entries(c);
  return e.length ? e.map(([k, v]) => `${v} ${k}`).join(' · ') : '½ metal back';
};

function canPlace(name, t) {
  if (!t) return [false, ''];
  const d = B[name];
  if (name === 'recycle') return t.b === 'zhouse' ? [false, 'That is the Zorp family’s home!'] : t.b ? [true, ''] : [false, 'Nothing to recycle here.'];
  if (name === 'comet') {
    if (t.layer) return [false, 'Comets can only hit the surface.'];
    if (t.b) return [false, 'A comet would flatten that building.'];
    if (t.type === 'rock') return [false, 'Aim for open ground or a crater.'];
    if (S.cometCd > 0) return [false, `Next comet arrives in ${Math.ceil(S.cometCd)} s.`];
  } else {
    if (t.b) return [false, 'This tile already has a building.'];
    const layer = t.layer || 'surface', where = WHERE[name] || ['surface', 'under', 'sky'];
    if (!where.includes(layer)) return [false, `${d.name}s can’t go ${LAYER_NAME[layer]}.`];
    const type = t.type === 'cave' || t.type === 'isle' ? 'plain' : t.type === 'magma' ? 'vent' : t.type;
    if (!d.on.includes(type)) return [false, d.onText];
    if (d.unique && count(name) > 0) return [false, `You only need one ${d.name.toLowerCase()}.`];
  }
  if (!afford(d.cost)) {
    const miss = Object.entries(d.cost).filter(([k, v]) => S[k] < v).map(([k, v]) => `${Math.ceil(v - S[k])} more ${k}`);
    return [false, 'Need ' + miss.join(' and ') + '.'];
  }
  return [true, ''];
}

function place(name, t) {
  const [ok, why] = canPlace(name, t);
  if (!ok) { if (why) toast(why, 'bad'); sfx('nope'); return; }
  const d = B[name];
  for (const [k, v] of Object.entries(d.cost)) S[k] -= v;
  dirty = true; S.lastProgress = S.time;
  const c = center(t);
  if (name === 'recycle') {
    const refund = Math.floor((B[t.b].cost.metal || 0) / 2);
    S.metal += refund;
    t.b = null;
    burst(c.x, c.y - 8, 14, ['#ffd166', '#b8afd8', '#ffffff']);
    toast(`Recycled for ${refund} metal`); sfx('pop');
    return;
  }
  if (name === 'comet') {
    S.cometCd = COMET_CD;
    comets.push({ t, p: 0 });
    toast('Comet inbound!'); sfx('whoosh');
    return;
  }
  t.b = name; t.born = RT;
  if (name === 'tower' || FARMS.includes(name) || name === 'pipe') updateWater();
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 6, life: 0.6, max: 0.6, color: '#ffffff' });
  burst(c.x, c.y, 8, ['#ffd7b8', '#ffffff']);
  sfx('build');
}

function cometImpact(t) {
  const c = center(t);
  dirty = true;
  S.planet.press += 2.5;
  S.planet.temp = Math.min(22, S.planet.temp + 1.5);
  if (t.type === 'crater' || t.type === 'frozen') {
    t.type = S.planet.temp >= 0 ? 'lake' : 'frozen';
  } else if (t.type === 'plain' || t.type === 'ore') {
    t.type = 'crater'; t.h = 0; t.basin = true; t.lichen = 0;
  }
  shake = RM ? 0 : 14;
  fx.push({ kind: 'flash', life: 0.35, max: 0.35 });
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 10, life: 0.9, max: 0.9, color: '#ffffff', big: true });
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 6, life: 1.2, max: 1.2, color: '#9be3ff', big: true });
  burst(c.x, c.y - 4, 34, ['#ff9a6a', '#ffd166', '#9be3ff', '#ffffff', '#c4552d'], 1.8);
  for (let i = 0; i < 6; i++) fx.push(puff(c.x + (Math.random() - .5) * 40, c.y - 6, '#f3d9cf', 1.6));
  sfx('boom');
  say('kip', 'Direct hit! Atmosphere: slightly thicker. Crater: slightly bigger. Me: extremely happy.', 'comet1');
  toast(t.type === 'frozen' ? 'Splash! The crater filled with ice. Warm Mars above 0 °C to melt it.'
      : t.type === 'lake' && t.basin ? 'Splash! A new crater lake.' : '+2.5 kPa of fresh atmosphere', 'good');
}

// ---------------------------------------------------------------- effects
function puff(x, y, color, scale = 1) {
  return { kind: 'puff', x, y, vx: (Math.random() - 0.3) * 6, vy: -10 - Math.random() * 8, r: 3 * scale, grow: 5 * scale, life: 2.4, max: 2.4, color };
}
function burst(x, y, n, colors, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (30 + Math.random() * 60) * power;
    fx.push({ kind: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 40 * power, r: 1.2 + Math.random() * 2.2, life: 0.8 + Math.random() * 0.5, max: 1.3, color: colors[i % colors.length], g: 140 });
  }
}

let emitT = 0;
function updateFX(dt, simDt) {
  // emitters from buildings
  emitT += simDt;
  if (emitT > 0.45) {
    emitT = 0;
    for (const t of curTiles()) {
      if (!t.b || S.eff <= 0.05) continue;
      const c = center(t);
      if (t.b === 'factory') {
        fx.push(puff(c.x - 7, c.y - 32, Math.random() < 0.5 ? '#ffb3c1' : '#ffcfa8'));
        if (Math.random() < 0.6) fx.push(puff(c.x + 4, c.y - 31, '#ffc2cf'));
      } else if (t.b === 'mine' && Math.random() < 0.35) {
        fx.push({ ...puff(c.x + 12, c.y + 2, '#d98b62', 0.5), life: 1.2, max: 1.2 });
      } else if (t.b === 'seeder' && S.planet.temp >= -20 && S.planet.press >= 5 && Math.random() < 0.6) {
        fx.push({ kind: 'dot', x: c.x + (Math.random() - .5) * 10, y: c.y - 10, vx: (Math.random() - .5) * 30, vy: -14, r: 1.5, life: 1.8, max: 1.8, color: '#9cf0bd', g: -4 });
      }
    }
  }
  for (const p of fx) {
    p.life -= dt;
    if (p.kind === 'puff') { p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.grow * dt; p.vy *= 0.99; }
    else if (p.kind === 'dot') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= 0.98; }
    else if (p.kind === 'ring') { p.r += (p.big ? 120 : 50) * dt; }
    else if (p.kind === 'drone') {
      const k = 1 - p.life / p.max;
      p.x = lerp(p.x0, p.x2, k); p.y = lerp(p.y0, p.y2, k) - Math.sin(k * Math.PI) * 30;
      if (p.life <= dt && !p.done) { p.done = true; p.hit(); }
    }
  }
  fx = fx.filter(p => p.life > 0);
  for (const c of comets) c.p += dt / 1.3;
  for (const c of comets) if (c.p >= 1 && !c.hit) { c.hit = true; cometImpact(c.t); }
  comets = comets.filter(c => !c.hit);
  for (const c of clouds) { c.x += c.spd * dt; if (c.x > 460) c.x = -460; }
  shake = Math.max(0, shake - dt * 30);
}

// ---------------------------------------------------------------- geometry
function center(t) {
  const bob = t.layer === 'sky' ? Math.sin(RT * 0.7 + (t.isl || 0) * 1.7) * 3 : 0;
  return { x: (t.gx - t.gy) * 32, y: (t.gx + t.gy + 1) * 16 - t.h * HZ + bob };
}
function silhouette(t) {
  const c = center(t), d = t.h * HZ + BASE;
  return [[c.x, c.y - 16], [c.x + 32, c.y], [c.x + 32, c.y + d], [c.x, c.y + 16 + d], [c.x - 32, c.y + d], [c.x - 32, c.y]];
}
function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function pick(mx, my) {
  const wx = (mx - view.x) / view.s, wy = (my - view.y) / view.s;
  for (let i = order.length - 1; i >= 0; i--) if (order[i].type !== 'void' && inPoly(wx, wy, silhouette(order[i]))) return order[i];
  return null;
}

// Fits the map between the header and the toolbar. It ignores small changes in the HUD
// (numbers changing width, the tip box) so the world doesn't jump or zoom while you play.
function layout(force = false) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  const resized = cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr);
  if (resized) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const top = $('.top').getBoundingClientRect().bottom + 8;
  const barTop = $('.bottom').getBoundingClientRect().top;
  const tipRoom = W < 720 ? 6 : 64;
  const availH = Math.max(160, barTop - tipRoom - top), availW = W - 16;
  const bw = N * 64, bh = N * 32 + BASE + 3 * HZ + 50;
  const s = Math.min(availW / bw, availH / bh, 1.6);
  const next = { W, H, dpr, s, x: W / 2, y: top + (availH - bh * s) / 2 + (3 * HZ + 50) * s };
  $('#toasts').style.top = top + 'px';
  $('#talk').style.bottom = (H - barTop + tipRoom + 4) + 'px';
  if (!force && !resized && view.W === W && view.H === H && Math.abs(next.s - view.s) / view.s < 0.06 && Math.abs(next.y - view.y) < 24) return;
  view = next;
}

// ---------------------------------------------------------------- drawing: world
const PAL = {
  plain:  ['#e5733f', '#c4552d', '#a5422a'],
  ore:    ['#e06d3d', '#c4552d', '#a5422a'],
  ice:    ['#eef6ff', '#b9d4ef', '#95b6dc'],
  crater: ['#c65a33', '#c4552d', '#a5422a'],
  lake:   ['#3d9df0', '#c4552d', '#a5422a'],
  frozen: ['#d9edfb', '#c4552d', '#a5422a'],
  rock:   ['#cf6a43', '#b24f30', '#923f28'],
  ruin:   ['#d9784a', '#c4552d', '#a5422a'],
  relic:  ['#c9663d', '#c4552d', '#a5422a'],
  vent:   ['#b85a36', '#c4552d', '#a5422a'],
  nest:   ['#a8502f', '#c4552d', '#a5422a'],
  cave:   ['#7a5584', '#57395f', '#452c4c'],
  wall:   ['#4d3254', '#3b2541', '#2e1c33'],
  crystal: ['#6c4f86', '#57395f', '#452c4c'],
  magma:  ['#5e3a4a', '#57395f', '#452c4c'],
  isle:   ['#8fd6a0', '#c99a6b', '#a87c55'],
  void:   ['#000000', '#000000', '#000000'],
};
const DECO = { pebble: '#f28d5c', rim: '#e98a5a', pit: '#a5462a', pit2: '#b8532f', cone: ['#e8875a', '#b8502f', '#d06a42'] };
// side and bedrock colours per layer: [left, right, band left, band right]
const SIDES = { surface: ['#c4552d', '#a5422a', '#7d3326', '#672a22'], under: ['#57395f', '#452c4c', '#2e1c33', '#24152a'], sky: ['#c99a6b', '#a87c55', '#8a6444', '#6f4f35'] };

function terra() {
  const p = S.planet;
  return clamp((p.press - 0.6) / 12, 0, 1) * 0.6 + clamp((p.temp + 63) / 63, 0, 1) * 0.4;
}

function drawTile(g, t) {
  if (t.type === 'void') return;
  const sky = t.layer === 'sky';
  const c = center(t), d = sky ? t.h * HZ + 14 : t.h * HZ + BASE;
  const LP = LEVELS[S.level].pal || {};
  const pal = LP[t.type] || PAL[t.type];
  const sides = LP.sides && !t.layer ? LP.sides : SIDES[t.layer || 'surface'];
  let top = pal[0];
  if (t.h === 2 && t.type !== 'ice') top = shade(top, 0.07);
  if (t.type === 'plain' || t.type === 'ore' || t.type === 'rock' || t.type === 'crater') top = shade(top, (t.v - 0.5) * 0.08);
  if (t.lichen > 0) top = mix(top, '#4cb878', t.lichen * 0.8);
  const N_ = [c.x, c.y - 16], E = [c.x + 32, c.y], S_ = [c.x, c.y + 16], W = [c.x - 32, c.y];
  const left = t.type === 'ice' || t.type === 'wall' ? pal[1] : sides[0], right = t.type === 'ice' || t.type === 'wall' ? pal[2] : sides[1];
  if (sky) { // floating island: earthy sides that taper to a point underneath
    g.fillStyle = left;  poly(g, [W, S_, [S_[0], S_[1] + d], [W[0] + 10, W[1] + d - 4]]);
    g.fillStyle = right; poly(g, [S_, E, [E[0] - 10, E[1] + d - 4], [S_[0], S_[1] + d]]);
    g.fillStyle = sides[3]; poly(g, [[S_[0] - 12, S_[1] + d - 2], [S_[0] + 12, S_[1] + d - 2], [S_[0], S_[1] + d + 14]]);
  } else {
    g.fillStyle = left;  poly(g, [W, S_, [S_[0], S_[1] + d], [W[0], W[1] + d]]);
    g.fillStyle = right; poly(g, [S_, E, [E[0], E[1] + d], [S_[0], S_[1] + d]]);
    // bedrock band
    const bd = BASE * 0.55;
    g.fillStyle = sides[2]; poly(g, [[W[0], W[1] + d - bd], [S_[0], S_[1] + d - bd], [S_[0], S_[1] + d], [W[0], W[1] + d]]);
    g.fillStyle = sides[3]; poly(g, [[S_[0], S_[1] + d - bd], [E[0], E[1] + d - bd], [E[0], E[1] + d], [S_[0], S_[1] + d]]);
    if (t.type === 'ice') { // ice sheet sits on rock
      g.fillStyle = sides[0]; poly(g, [[W[0], W[1] + 6], [S_[0], S_[1] + 6], [S_[0], S_[1] + d - bd], [W[0], W[1] + d - bd]]);
      g.fillStyle = sides[1]; poly(g, [[S_[0], S_[1] + 6], [E[0], E[1] + 6], [E[0], E[1] + d - bd], [S_[0], S_[1] + d - bd]]);
    }
  }
  g.fillStyle = top; poly(g, [N_, E, S_, W]);
  g.strokeStyle = 'rgba(80,20,20,0.10)'; g.lineWidth = 1; g.stroke();
  g.save(); g.translate(c.x, c.y); decorate(g, t); g.restore();
}

function decorate(g, t) {
  const v = t.v, T = RT, D = LEVELS[S.level].deco || DECO;
  switch (t.type) {
    case 'plain': {
      if (t.b) break;
      if (v > 0.25) { ell(g, -10 + v * 14, -2 + v * 4, 2.6, 1.4, 'rgba(120,35,20,0.25)'); ell(g, -10 + v * 14, -3 + v * 4, 2.2, 1.2, D.pebble); }
      if (v > 0.6) { ell(g, 9 - v * 6, 4, 1.8, 1, 'rgba(120,35,20,0.25)'); ell(g, 9 - v * 6, 3.4, 1.5, 0.9, D.pebble); }
      if (v < 0.18 && !D.mush) { g.strokeStyle = 'rgba(140,45,25,0.35)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(4, 1, 7, 3.2, 0, 0, Math.PI * 2); g.stroke(); }
      if (D.mush && v > 0.55) { // alien mushrooms
        g.fillStyle = '#f3e9ff'; g.fillRect(5, -6, 2, 7); g.fillRect(-9, -3, 1.6, 5);
        ell(g, 6, -6, 5, 3, v > 0.8 ? '#ff9fe8' : '#ffd166'); ell(g, -8.2, -3, 3.5, 2, '#7ff7d4');
        ell(g, 4.5, -7, 1, 0.7, '#ffffff');
      }
      break;
    }
    case 'ore': {
      if (t.b === 'mine') { ell(g, -12, 3, 2, 1, '#7a5fd0'); break; }
      if (t.b) break;
      const spots = [[-9, 1], [6, -4], [3, 5]];
      spots.forEach(([x, y], i) => {
        if (i === 2 && v < 0.4) return;
        const h = 6 + ((v * 10 + i * 3) % 4);
        ell(g, x, y + 1, 4, 1.8, 'rgba(60,20,60,0.25)');
        g.fillStyle = '#7a5fd0'; poly(g, [[x - 3, y], [x - 3, y - h], [x, y - h - 4], [x + 3, y - h], [x + 3, y]]);
        g.fillStyle = '#b8a2ff'; poly(g, [[x - 3, y], [x - 3, y - h], [x, y - h - 4], [x, y + 1]]);
        g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(x - 2, y - h + 1, 0.9, h * 0.5);
      });
      break;
    }
    case 'ice': {
      if (t.b) break;
      ell(g, -8 + v * 10, -1, 7, 3, '#ffffff');
      if (v > 0.4) ell(g, 8, 4, 5, 2.2, '#ffffff');
      g.strokeStyle = 'rgba(120,170,220,0.6)'; g.lineWidth = 1; g.beginPath();
      g.moveTo(-14, 4); g.lineTo(-6, 6); g.lineTo(0, 3); g.moveTo(6, -6); g.lineTo(12, -3); g.stroke();
      break;
    }
    case 'crater': {
      ell(g, 0, 0, 23, 10.5, D.rim);
      ell(g, 0, 1, 20, 9, D.pit);
      g.save(); g.beginPath(); g.ellipse(0, 1, 20, 9, 0, 0, Math.PI * 2); g.clip();
      ell(g, 3, 4, 20, 9, D.pit2); g.restore();
      break;
    }
    case 'frozen': {
      ell(g, 0, 0, 23, 10.5, '#e98a5a');
      ell(g, 0, 1, 20, 9, '#cfe7fa');
      g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1; g.beginPath();
      g.moveTo(-10, -1); g.lineTo(-2, 2); g.lineTo(4, -1); g.moveTo(-2, 2); g.lineTo(2, 6); g.stroke();
      break;
    }
    case 'lake': {
      if (t.basin) { ell(g, 0, 0, 23, 10.5, D.rim); ell(g, 0, 1, 20, 9, D.lakeDeep || '#2f8be0'); ell(g, -2, 0, 16, 6.5, D.lake || '#3fa2f2'); }
      else { g.fillStyle = D.lake || '#3fa2f2'; poly(g, [[0, -12], [24, 0], [0, 12], [-24, 0]]); }
      g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 1.2; g.lineCap = 'round';
      const o = Math.sin(T * 1.6 + v * 7) * 3;
      g.beginPath(); g.moveTo(-9 + o, -2); g.lineTo(-3 + o, -2); g.moveTo(3 - o, 3); g.lineTo(10 - o, 3); g.stroke();
      break;
    }
    case 'ruin': {
      if (t.b) break;
      const glow = 0.55 + 0.45 * Math.sin(T * 2.2 + v * 6);
      ell(g, 0, 3, 18, 6, 'rgba(70,16,24,0.25)');
      g.fillStyle = '#4b4a6b'; poly(g, [[-13, 3], [-13, -14], [-7, -22], [7, -22], [13, -14], [13, 3], [7, 3], [7, -12], [-7, -12], [-7, 3]]);
      g.fillStyle = '#5f5d86'; poly(g, [[-13, 3], [-13, -14], [-7, -22], [-7, 3]]);
      g.strokeStyle = `rgba(127,247,255,${glow})`; g.lineWidth = 1.3; g.lineCap = 'round';

    const bob = LEVELS[S.level].offworld ? Math.abs(Math.sin(RT * 2.2 + k)) * 9 : Math.abs(Math.sin(RT * 8 + k)) * 1.2;
    ell(g, x, y + 0.5, 2.6, 1.1, 'rgba(70,16,24,0.25)');
    ell(g, x, y - 3.5 - bob, 2.6, 3.4, '#ffffff');
    ell(g, x + dir * 1, y - 4.6 - bob, 1.5, 1.1, '#ff9b54');
  }
}

  if (S.view === 'sky') {
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, 'rgba(92,170,255,0.25)'); gr.addColorStop(1, 'rgba(255,190,150,0.35)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  ctx.translate(view.x + sx, view.y + sy); ctx.scale(s, s);
  if (surf && !LEVELS[S.level].offworld) drawHalo(ctx);
  if (S.view === 'sky') for (const c of clouds) { ctx.save(); ctx.globalAlpha = 0.5; cloudShape(ctx, c.x, c.y + 260, c.s * 1.4, '#ffffff'); ctx.restore(); }
  const byTile = new Map();
  for (const c of crits) { const k = critTile(c); if (!byTile.has(k)) byTile.set(k, []); byTile.get(k).push(c); }
  for (const t of order) {
    drawTile(ctx, t);
    if (t.b) drawBuildingOn(ctx, t);
    const cs = surf && byTile.get(t); if (cs) for (const c of cs) drawCritter(ctx, c);
  }
  if (surf && typeof drawBoss === 'function') drawBoss(ctx);
  if (hover && !tool) {
    const c = center(hover);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 16); ctx.lineTo(c.x + 32, c.y); ctx.lineTo(c.x, c.y + 16); ctx.lineTo(c.x - 32, c.y); ctx.closePath(); ctx.stroke();
  }
  drawGhost(ctx);
  if (surf) drawBeams(ctx);
  drawFX(ctx);
  if (surf) { drawSaucer(ctx); drawVell(ctx); drawClouds(ctx); drawComets(ctx); drawMeteors(ctx); if (LEVELS[S.level].bonus) drawGlorp(ctx); }
  if (S.storm > 0 && S.view !== 'under') {
    const a = clamp(Math.min(S.storm, 22 - S.storm) / 3, 0, 1);
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgba(214,128,74,${0.32 * a})`; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(255,214,170,${0.35 * a})`; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 70; i++) {
      const x = ((i * 97.3 + RT * (260 + (i % 5) * 40)) % (W + 200)) - 100, y = (i * 53.7) % H;
      ctx.moveTo(x, y); ctx.lineTo(x + 30, y + 4);
    }
    ctx.stroke(); ctx.restore();
  }
  const nf = S.view === 'under' ? 0.85 : nightness();
  if (nf > 0.01 && S.view !== 'under') {
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgba(10,14,48,${0.5 * nf})`; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  drawLights(ctx, nf);
  for (const p of fx) if (p.kind === 'flash') {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgba(255,250,235,${(p.life / p.max) * 0.55})`; ctx.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- UI
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 420); }, 2600);
}
const once = new Set();
function toastOnce(key, msg, kind) { if (once.has(key)) return; once.add(key); toast(msg, kind); }

function buildToolbar() {
  const bar = $('#toolbar'); bar.innerHTML = '';
  levelTools().forEach((name, i) => {
    const d = B[name];
    const btn = document.createElement('button');
    btn.className = 'tool'; btn.id = 'tool-' + name; btn.dataset.tool = name;
    btn.setAttribute('aria-label', `${d.name}, ${costText(d.cost)}`);
    const cnv = document.createElement('canvas');
    const dpr = 2; cnv.width = 58 * dpr; cnv.height = 46 * dpr;
    const g = cnv.getContext('2d'); g.scale(dpr, dpr); g.translate(29, 34); g.scale(0.85, 0.85);
    if (!d.ability) { g.fillStyle = 'rgba(255,255,255,0.08)'; poly(g, [[0, -14], [28, 0], [0, 14], [-28, 0]]); }
    DRAW[name](g, 0.6, 0.3);
    btn.innerHTML = i < 10 ? `<kbd>${(i + 1) % 10}</kbd>` : '';
    btn.appendChild(cnv);
    btn.insertAdjacentHTML('beforeend', `<span class="nm">${d.name}</span><span class="cost">${costText(d.cost).replace(' · ', '<br>')}</span>`);
    btn.addEventListener('click', () => selectTool(tool === name ? null : name));
    btn.addEventListener('mouseenter', () => showTip(name));
    btn.addEventListener('mouseleave', () => showTip());
    bar.appendChild(btn);
  });
}

function selectTool(name) {
  tool = name;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === name));
  showTip();
  sfx('tick');
}

function showTip(preview) {
  const el = $('#tip');
  el.classList.remove('idle');
  const name = preview || tool;
  if (name) {
    const d = B[name];
    let extra = '';
    if (!preview && hover) { const [ok, why] = canPlace(name, hover); if (!ok && why) extra = `<br><span class="bad">${why}</span>`; }
    el.innerHTML = `<strong>${d.name} <span class="muted" style="font-size:12px;font-family:var(--body)">${costText(d.cost)}</span></strong>${d.desc}${extra}`;
    return;
  }
  if (hoverThing === 'saucer') { el.innerHTML = '<strong>Zorp’s flying saucer</strong>An alien trader! Click it to see what Zorp wants to swap.'; return; }
  if (hoverThing === 'critter') { el.innerHTML = '<strong>Critter</strong>A cheeky little native of Mars. Tap it to bonk it before it nibbles something!'; return; }
  if (hover) {
    const [n, txt] = (LEVELS[S.level].tileInfo || {})[hover.type] || TILE_INFO[hover.type];
    let b = '';
    if (hover.b) b = `<br><b>${B[hover.b].name}:</b> ${B[hover.b].desc}`;
    if (hover.b === 'dig') b += ` <b>${Math.round((hover.prog || 0) * 100)}% dug.</b>`;
    if (hover.type === 'nest') b += ` <b>${Math.ceil(hover.nhp)} hits left.</b>`;
    if (FARMS.includes(hover.b)) b += hover.wet ? ' <span style="color:var(--sky)">Watered: double food.</span>' : ' <span class="muted">Not watered.</span>';
    if (hover.off > 0) b += ' <span class="bad">A critter is nibbling it!</span>';
    let l = hover.lichen > 0.05 ? `<br><span style="color:var(--leaf)">Lichen cover ${Math.round(hover.lichen * 100)}%</span>` : '';
    el.innerHTML = `<strong>${n}</strong>${txt}${b}${l}`;
    return;
  }
  el.innerHTML = '<span class="muted">Pick a building below (or press 1–9, 0), then click a tile on the map. Tap critters to bonk them. Right-click or Esc to cancel.</span>';
  el.classList.add('idle');
}

function buildGoals() {
  const L = LEVELS[S.level];
  $('#lvl-name').textContent = L.name;
  $('#goal-list').innerHTML = L.goals.map((g, i) => {
    let head = '';
    if (L.paths && (i === 0 || L.goals[i - 1].path !== g.path)) head = (i ? '<li class="or">or</li>' : '') + `<li class="path">${L.paths[g.path].name}</li>`;
    return head + `<li id="goal-${i}"><span class="dot"></span><span>${g.text}</span><span class="pv"></span></li>`;
  }).join('');
}

  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(sfxBus); src.start();
}
function sfx(k) {
  switch (k) {
    case 'build': tone(520, 0.12, 'triangle', 0.12, 260); tone(880, 0.1, 'sine', 0.06, 0, 0.06); break;
    case 'pop': tone(400, 0.12, 'triangle', 0.1, -200); break;
    case 'tick': tone(1200, 0.03, 'sine', 0.03); break;
    case 'nope': tone(200, 0.14, 'square', 0.04, -60); break;
    case 'whoosh': noise(1.2, 0.08, 1800); break;
    case 'boom': noise(1.4, 0.45, 500); tone(90, 0.8, 'sine', 0.3, -50); break;
    case 'chime': [660, 880, 1320].forEach((f, i) => tone(f, 0.3, 'sine', 0.08, 0, i * 0.08)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'triangle', 0.09, 0, i * 0.12)); break;
    case 'bonk': tone(620, 0.14, 'square', 0.06, -380); tone(1300, 0.08, 'sine', 0.05, 0, 0.05); break;
    case 'roar': noise(1.6, 0.35, 380); tone(120, 1.2, 'sawtooth', 0.12, -60); tone(180, 1, 'sawtooth', 0.06, -90); break;
    case 'clang': tone(900, 0.12, 'square', 0.05, -500); tone(1800, 0.06, 'sine', 0.04); break;
    case 'zap': noise(0.18, 0.12, 5000); tone(1500, 0.15, 'sawtooth', 0.04, -1000); break;
    case 'relic': [392, 523, 659, 880].forEach((f, i) => tone(f, 0.9, 'sine', 0.06, 0, i * 0.09)); break;
    case 'saucer': tone(260, 1.6, 'sine', 0.06, 520); tone(268, 1.6, 'triangle', 0.04, 540); break;
  }
}

// ---------------------------------------------------------------- input
let hoverThing = null;
function setHover(e) {
  if (!S || A) return;
  const thing = saucerAt(e.clientX, e.clientY) ? 'saucer' : critterAt(e.clientX, e.clientY) ? 'critter' : null;
  const t = pick(e.clientX, e.clientY);
  if (t !== hover || thing !== hoverThing) { hover = t; hoverThing = thing; showTip(); }
  cv.style.cursor = thing ? 'pointer' : '';
}
cv.addEventListener('pointermove', setHover);
cv.addEventListener('pointerleave', () => { hover = null; showTip(); });
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (!S || modalOpen || A) return;
  if (e.button === 2) { selectTool(null); return; }
  if (saucerAt(e.clientX, e.clientY)) { showTrade(); return; }
  const crit = critterAt(e.clientX, e.clientY);
  if (crit) { bonk(crit); return; }
  if (bossAt(e.clientX, e.clientY)) return;
  if (crasherAt(e.clientX, e.clientY)) return;
  const met = meteorAt(e.clientX, e.clientY);
  if (met) { stopMeteor(met); return; }
  setHover(e);
  if (!hover) return;
  if (tool) { place(tool, hover); showTip(); }
  else if (hover.type === 'nest') hitNest(hover);
  else if (hover.b === 'pad' && typeof showRocket === 'function') showRocket();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (modalOpen || !S || A) return;
  if (e.key === 'Escape') selectTool(null);
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (e.key === 'm' || e.key === 'M') toggleMusic();
  else if (e.key === 'v' || e.key === 'V') toggleVoice();
  else if (e.key === 'Enter' && talking) skipLine();
  else if (/^[0-9]$/.test(e.key)) { const n = levelTools()[(+e.key + 9) % 10]; if (n) selectTool(tool === n ? null : n); }
  else if ((e.key === 'r' || e.key === 'R') && LEVELS[S.level].research) showTree();
});
function togglePause() { paused = !paused; const b = $('#btn-pause'); b.textContent = paused ? '▶' : '❚❚'; b.classList.toggle('on', paused); }
$('#btn-pause').addEventListener('click', togglePause);
$('#btn-speed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('#btn-speed').textContent = speed + '×'; $('#btn-speed').classList.toggle('on', speed > 1); });
function syncAudioButtons() {
  for (const [id, key, label] of [['#btn-music', 'music', 'Music'], ['#btn-sound', 'sfx', 'Sound effects and voices']]) {
    const b = $(id), on = prefs[key];
    b.classList.toggle('off', !on); b.setAttribute('aria-pressed', String(on));
    b.title = `${label}: ${on ? 'on' : 'off'}${key === 'music' ? ' (M)' : ' (V)'}`;
  }
}
function toggleMusic() {
  prefs.music = !prefs.music; savePrefs(); syncAudioButtons();
  if (prefs.music) { audioInit(); musicStart(); } else musicStop();
  toast(prefs.music ? 'Music on' : 'Music off');
}
$('#btn-music').addEventListener('click', toggleMusic);
$('#layers').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
$('#chip-science').addEventListener('click', () => { if (S && LEVELS[S.level].research) showTree(); });
$('#chip-science').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showTree(); } });
$('#btn-sound').addEventListener('click', toggleVoice);
syncAudioButtons();
addEventListener('resize', () => layout(true));
$('#goals').addEventListener('toggle', () => requestAnimationFrame(() => layout(true)));

// ---------------------------------------------------------------- loop
let last = performance.now(), uiT = 0, saveT = 0, dirty = false;
function frame(now) {
  requestAnimationFrame(frame); // scheduled first, so one bad frame can never stop the game
  const rdt = Math.min(0.1, (now - last) / 1000); last = now; RT += rdt;
  const running = S && !paused && !modalOpen && !A;
  const simDt = running ? rdt * speed : 0;
  if (running) tick(simDt);
  if (S) updateFX(running ? rdt * Math.min(speed, 2) : rdt * 0.3, simDt);
  talkUpdate(rdt);
  uiT += rdt;
  if (uiT > 0.12 && S && !A) { uiT = 0; updateUI(); layout(); }
  saveT += rdt;
  if (playing && !A && !(S && S.launchT) && (dirty || (saveT > 5 && running))) saveGame();
  if (A) { try { arcadeUpdate(rdt); } catch (e) { console.error(e); } }
  if (A) { try { arcadeRender(); } catch (e) { console.error(e); } } else render();
}

// ---------------------------------------------------------------- boot
function boot(data) {
  initStars(); initClouds();
  if (innerWidth < 720) $('#goals').open = false; // phones: objectives fold into the level title
  if (data && data.S) {
    S = data.S; for (const t of S.tiles) t.born = -9;
    afterLoad();
    playing = !!data.playing;
    if (data.modal === false) closeModal(); else showTitle();
  } else {
    const save = readSave();
    if (save) loadSave(save); else { S = newState(0); afterLoad(); }
    playing = false;   // stay on the title screen until the player picks Continue or a level
    $('#saved').textContent = 'Progress saves automatically';
    showTitle();
  }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ S, modal: modalOpen, playing }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
