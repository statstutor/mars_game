<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make Mars Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a floating isometric diorama of Mars fills the screen; HUD cards float over space at the edges. */
:root {
  --space: #120e2b;
  --panel: rgba(32, 23, 72, 0.8);
  --panel-solid: #1f1747;
  --line: rgba(255, 255, 255, 0.1);
  --ink: #fff6ec;
  --muted: #b8afd8;
  --mars: #ff7a45;
  --sky: #5cc8ff;
  --leaf: #5fd38d;
  --warn: #ff5d73;
  --sun: #ffd166;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--space); color: var(--ink); font-family: var(--body); font-size: 14px; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.card { pointer-events: auto; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px; }

#goals { width: 290px; max-width: 100%; padding: 12px 14px; }
#goals summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
#goals summary::-webkit-details-marker { display: none; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mars); }
#goals h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 21px; text-wrap: balance; }
#goal-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
#goal-list li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
#goal-list .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
#goal-list li.done .dot { background: var(--leaf); border-color: var(--leaf); }
#goal-list li.done .dot::after { content: ''; width: 6px; height: 3px; border: solid #123; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
#goal-list li.done span:nth-child(2) { color: var(--muted); }
#goal-list .pv { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
#goal-list li.done .pv { color: var(--leaf); }

.stats { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: 660px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .2s, background .2s; }
.chip .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.chip .ic svg { width: 16px; height: 16px; fill: #1a1238; }
.chip .tx { display: flex; flex-direction: column; line-height: 1.1; }
.chip b { font-family: var(--display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip small { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip small.neg { color: var(--warn); }
.chip small.pos { color: var(--leaf); }
.chip.warn { border-color: var(--warn); background: rgba(120, 25, 50, 0.75); }
.chip.planet b { color: var(--ink); }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#tip { pointer-events: none; max-width: min(560px, 100%); padding: 10px 14px; font-size: 13px; line-height: 1.45; }
#tip strong { font-family: var(--display); font-weight: 600; font-size: 15px; display: block; }
#tip .bad { color: var(--warn); font-weight: 800; }
#tip .muted { color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: stretch; max-width: 100%; pointer-events: none; }
.toolbar { pointer-events: auto; display: flex; gap: 4px; overflow-x: auto; padding: 6px; min-width: 0; scrollbar-width: thin; }
.tool { flex: 0 0 auto; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px 7px; border-radius: 13px; background: transparent; border: 2px solid transparent; color: var(--ink); cursor: pointer; font: inherit; position: relative; transition: background .15s, transform .15s; }
.tool:hover { background: rgba(255, 255, 255, 0.07); }
.tool:focus-visible, .ctl:focus-visible, .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tool.on { background: rgba(255, 122, 69, 0.2); border-color: var(--mars); }
.tool canvas { width: 58px; height: 46px; }
.tool .nm { font-family: var(--display); font-size: 12.5px; font-weight: 500; line-height: 1.1; text-align: center; }
.tool .cost { font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.2; text-align: center; }
.tool.poor .cost { color: var(--warn); }
.tool kbd { position: absolute; top: 4px; left: 7px; font: 700 10px var(--body); color: var(--muted); }
.tool .cd { position: absolute; inset: 0; border-radius: 11px; background: rgba(18, 14, 43, 0.7); display: grid; place-items: center; font: 600 18px var(--display); }
.controls { pointer-events: auto; display: grid; grid-template-columns: repeat(2, 40px); gap: 4px; padding: 6px; align-content: center; }
.ctl { width: 40px; height: 34px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, 0.07); color: var(--ink); font: 600 13px var(--display); cursor: pointer; }
.ctl:hover { background: rgba(255, 255, 255, 0.14); }
.ctl.on { background: var(--mars); color: #24102a; }
.ctl svg { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }
.ctl.off { position: relative; color: var(--muted); }
.ctl.off::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--warn); transform: rotate(-40deg); border-radius: 2px; }

#toasts { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 5; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 13px; text-align: center; animation: pop .25s ease-out; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.toast.good { background: #1d5a43; }
.toast.bad { background: #6b1f37; }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .4s; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12, 7, 32, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; z-index: 10; }
.sheet { width: min(540px, 100%); max-height: 100%; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); animation: pop .35s ease-out; }
.sheet h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 9vw, 58px); line-height: .95; letter-spacing: -0.01em; text-wrap: balance; }
.sheet h1 .m { color: var(--mars); }
.sheet h1 .b { color: var(--sky); }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.55; font-size: 15px; color: #e9e2f7; max-width: 62ch; }
.sheet .fact { background: rgba(92, 200, 255, 0.1); border-left: 0; border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.sheet .fact b { color: var(--sky); }
.levels { display: grid; gap: 10px; }
.lvl { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--ink); cursor: pointer; font: inherit; }
.lvl:hover { border-color: var(--mars); background: rgba(255, 122, 69, 0.1); }
.lvl:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.lvl .n { width: 40px; height: 40px; border-radius: 50%; background: var(--mars); color: #24102a; display: grid; place-items: center; font: 700 20px var(--display); }
.lvl.two .n { background: var(--sky); }
.lvl b { font: 600 18px var(--display); display: block; }
.lvl small { color: var(--muted); font-size: 13px; }
.lvl .go { font: 600 14px var(--display); color: var(--mars); }
.lvl.two .go { color: var(--sky); }
.lvl.three .n { background: var(--leaf); }
.lvl.three .go { color: var(--leaf); }
.lvl.cont { border-color: var(--leaf); background: rgba(95, 211, 141, 0.1); }
.lvl.cont:hover { border-color: var(--leaf); background: rgba(95, 211, 141, 0.18); }
.lvl.cont .n { background: var(--leaf); font-size: 16px; }
.lvl.cont .go { color: var(--leaf); }
#talk { position: fixed; left: 16px; bottom: 200px; z-index: 11; width: min(410px, calc(100% - 32px)); display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: start; padding: 12px 14px 13px; cursor: pointer; animation: pop .25s ease-out; }
#talk canvas { width: 60px; height: 60px; display: block; }
#talk .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-right: 44px; }
#talk .who b { font: 600 16px var(--display); }
#talk .who small { font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
#talk p { margin: 3px 0 0; font-size: 14px; line-height: 1.45; min-height: 2.9em; }
#talk .skip { position: absolute; right: 8px; top: 8px; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--muted); font: 700 11px var(--body); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
#talk .skip:hover { color: var(--ink); }
#talk .skip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.chip.needs { display: grid; grid-template-columns: auto 46px; gap: 2px 6px; align-items: center; padding: 5px 12px; border-radius: 16px; }
.chip.needs span { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--leaf); transition: width .3s, background .3s; }
.trader { display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: center; }
.trader canvas { width: 60px; height: 60px; }
.trader p { font-size: 14px; }
.offers { display: grid; gap: 8px; }
.offer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: rgba(182, 243, 106, 0.06); color: var(--ink); font: inherit; cursor: pointer; }
.offer:hover:not(:disabled) { border-color: #b6f36a; background: rgba(182, 243, 106, 0.14); }
.offer:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.offer:disabled { opacity: 0.45; cursor: not-allowed; }
.offer .arrow { color: #b6f36a; font: 600 18px var(--display); }
.offer .get { font-weight: 800; }
.small-note { font-size: 12.5px !important; color: var(--muted) !important; }
#saved { margin: 10px 0 0; font-size: 11px; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font: 600 16px var(--display); cursor: pointer; background: var(--mars); color: #24102a; }
.btn.alt { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
.btn:hover { filter: brightness(1.08); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.how div { background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 10px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.how b { display: block; color: var(--ink); font: 600 14px var(--display); }

@media (max-width: 720px) {
  #goals { width: 100%; padding: 10px 12px; }
  #goals h2 { font-size: 18px; }
  .stats { justify-content: flex-start; max-width: 100%; }
  .group { justify-content: flex-start; }
  .chip { padding: 3px 9px 3px 3px; gap: 6px; }
  .chip .ic { width: 22px; height: 22px; }
  .chip .ic svg { width: 13px; height: 13px; }
  .chip b { font-size: 13px; }
  .chip small { font-size: 10px; }
  .tool { width: 66px; padding: 4px 2px 5px; }
  #tip.idle, #chip-o2 { display: none; }
  .chip.needs { padding: 3px 9px; }
  .tool canvas { width: 44px; height: 35px; }
  .tool .nm { font-size: 11px; }
  .tool kbd { display: none; }
  #tip { font-size: 12px; padding: 8px 12px; }
  #talk { grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 12px; }
  #talk canvas { width: 44px; height: 44px; }
  #talk p { font-size: 13px; }
  .how { grid-template-columns: 1fr; }
  .sheet { padding: 22px 18px; border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .sheet { animation: none; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="Isometric map of the Martian surface. Pick a building below, then click a tile to place it."></canvas>

<div id="ui">
  <header class="top">
    <details id="goals" class="card" open>
      <summary>
        <span class="eyebrow" id="lvl-eyebrow">Level 1 · Sol 1</span>
        <h2 id="lvl-name">Touchdown</h2>
      </summary>
      <ul id="goal-list"></ul>
      <p id="saved">Progress saves automatically</p>
    </details>
    <div class="stats">
      <div class="group" aria-label="Colony">
        <div class="chip" id="chip-energy" title="Energy (stored / capacity)">
          <span class="ic" style="background:var(--sun)"><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5h6l-1 8.5 9-11.5h-6z"/></svg></span>
          <span class="tx"><b id="v-energy">0</b><small id="r-energy">+0/s</small></span>
        </div>
        <div class="chip" title="Metal">
          <span class="ic" style="background:#b39cff"><svg viewBox="0 0 24 24"><path d="M12 2.5 3.5 7.2v9.6l8.5 4.7 8.5-4.7V7.2z"/></svg></span>
          <span class="tx"><b id="v-metal">0</b><small id="r-metal">+0/s</small></span>
        </div>
        <div class="chip" title="Water">
          <span class="ic" style="background:var(--sky)"><svg viewBox="0 0 24 24"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg></span>
          <span class="tx"><b id="v-water">0</b><small id="r-water">+0/s</small></span>
        </div>
        <div class="chip" title="Food">
          <span class="ic" style="background:#f0b35c"><svg viewBox="0 0 24 24"><path d="M12 8.2c-1.6-1.2-4.4-1.6-6.2.3C3.6 10.9 4.4 16 6.6 18.8c1.6 2 3.2 2.6 5.4 1.6 2.2 1 3.8.4 5.4-1.6 2.2-2.8 3-7.9.8-10.3-1.8-1.9-4.6-1.5-6.2-.3z"/><path d="M12.6 7.6c.2-2.4 1.6-4 3.9-4.6-.2 2.4-1.6 4-3.9 4.6z"/></svg></span>
          <span class="tx"><b id="v-food">0</b><small id="r-food">+0/s</small></span>
        </div>
        <div class="chip" id="chip-crystals" title="Alien crystals: critters drop them when bonked. Traders love them." hidden>
          <span class="ic" style="background:#c9a7ff"><svg viewBox="0 0 24 24"><path d="M12 2 19 9l-7 13L5 9z"/></svg></span>
          <span class="tx"><b id="v-crystals">0</b><small>crystals</small></span>
        </div>
        <div class="chip" title="Colonists living here / room in habitats">
          <span class="ic" style="background:#f7f4ff"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span>
          <span class="tx"><b id="v-pop">0</b><small>colonists</small></span>
        </div>
        <div class="chip needs" id="chip-needs" title="How fed, watered and happy the colonists are">
          <span>Fed</span><div class="meter"><i id="m-fed"></i></div>
          <span>Water</span><div class="meter"><i id="m-hyd"></i></div>
          <span>Happy</span><div class="meter"><i id="m-mood"></i></div>
        </div>
      </div>
      <div class="group" aria-label="Planet">
        <div class="chip planet" title="Average surface temperature. Earth: about 15 °C">
          <span class="ic" style="background:var(--mars)"><svg viewBox="0 0 24 24"><path d="M9.5 4.5a2.5 2.5 0 0 1 5 0v8.6a5 5 0 1 1-5 0z"/></svg></span>
          <span class="tx"><b id="v-temp">-63 °C</b><small>Earth 15 °C</small></span>
        </div>
        <div class="chip planet" title="Surface air pressure. Earth: 101 kPa">
          <span class="ic" style="background:#ff9fb1"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 0 0-9 9 9 9 0 0 0 1.4 4.8h15.2A9 9 0 0 0 21 13a9 9 0 0 0-9-9zm4.6 4.1-3.2 5.6a1.8 1.8 0 1 1-1.9-1.1z"/></svg></span>
          <span class="tx"><b id="v-press">0.6 kPa</b><small>Earth 101 kPa</small></span>
        </div>
        <div class="chip planet" id="chip-o2" title="Oxygen share of the air. Earth: 21%">
          <span class="ic" style="background:var(--leaf)"><svg viewBox="0 0 24 24"><circle cx="9" cy="13" r="5.5"/><circle cx="17.5" cy="7" r="3.5"/></svg></span>
          <span class="tx"><b id="v-o2">0.13 %</b><small>O₂ · Earth 21%</small></span>
        </div>
      </div>
    </div>
  </header>

  <footer class="bottom">
    <div id="tip" class="card"></div>
    <div class="bar">
      <div class="toolbar card" id="toolbar" role="toolbar" aria-label="Build"></div>
      <div class="controls card">
        <button class="ctl" id="btn-pause" title="Pause (Space)">❚❚</button>
        <button class="ctl" id="btn-speed" title="Game speed">1×</button>
        <button class="ctl" id="btn-music" title="Music: on (M)" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 4.5 20 2v13.2a3.3 3.3 0 1 1-2-3V6.6l-7 1.6v9a3.3 3.3 0 1 1-2-3z"/></svg></button>
        <button class="ctl" id="btn-sound" title="Sound effects: on" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4.5v15L7 15H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </footer>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="talk" class="card" hidden aria-live="polite">
  <canvas id="talk-face" width="120" height="120" aria-hidden="true"></canvas>
  <div><div class="who"><b id="talk-name"></b><small id="talk-role"></small></div><p id="talk-text"></p></div>
  <button class="skip" id="talk-skip" title="Skip (Enter)">Skip</button>
</div>
<div id="modal" hidden></div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const N = 11;               // grid size
const HZ = 11;              // px per elevation step (world units)
const BASE = 30;            // thickness of the diorama slab
const ECAP = 100;           // energy storage
const COMET_CD = 15;        // seconds between comets
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = s => document.querySelector(s);

// ---------------------------------------------------------------- utils
const hexCache = {};
const hex = h => hexCache[h] || (hexCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const shade = (a, t) => t > 0 ? mix(a, '#ffffff', t) : mix(a, '#000000', -t);
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = (v, d = 0) => v.toFixed(d).replace('-', '−');

function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); }
function ell(g, x, y, rx, ry, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function shadow(g, rx, ry) { ell(g, 2, 3, rx, ry, 'rgba(70,16,24,0.22)'); }
function isoBox(g, cx, cy, sx, sy, hh, top, left, right) {
  g.fillStyle = left;  poly(g, [[cx - sx, cy - hh], [cx, cy + sy - hh], [cx, cy + sy], [cx - sx, cy]]);
  g.fillStyle = right; poly(g, [[cx, cy + sy - hh], [cx + sx, cy - hh], [cx + sx, cy], [cx, cy + sy]]);
  g.fillStyle = top;   poly(g, [[cx, cy - sy - hh], [cx + sx, cy - hh], [cx, cy + sy - hh], [cx - sx, cy - hh]]);
}

const tileAt = (x, y) => (x >= 0 && y >= 0 && x < N && y < N) ? S.tiles[y * N + x] : null;

function newState(li) {
  const L = LEVELS[li];
  const r = rng(L.seed);
  const tiles = [];
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++)
    tiles.push({ gx, gy, type: 'plain', h: 1, b: null, born: -9, v: r(), lichen: 0, basin: false });
  const T = (x, y) => (x >= 0 && y >= 0 && x < N && y < N) ? tiles[y * N + x] : null;
  const m = L.map;
  for (const t of tiles) if (t.gx + t.gy + r() * 1.3 < m.ice) t.type = 'ice';
  for (const [mx, my, mr] of m.mountains) for (const t of tiles) {
    const d = Math.hypot(t.gx - mx, t.gy - my);
    if (d < 0.5 || (d < 1.05 && r() < 0.45)) { t.type = 'rock'; t.h = 3; }
    else if (d <= mr + 0.35 && t.type !== 'rock') { t.h = 2; if (t.type === 'ice') t.type = 'plain'; }
  }
  for (const [ox, oy, orr] of m.ore) for (const t of tiles) {
    const d = Math.hypot(t.gx - ox, t.gy - oy);
    if (t.type === 'plain' && (d < 0.5 || (d <= orr && r() > 0.35))) t.type = 'ore';
  }
  for (const [cx, cy] of m.craters) { const t = T(cx, cy); t.type = m.wet ? 'lake' : 'crater'; t.h = 0; t.basin = true; }
  for (const [rx, ry] of m.ruins) { const t = T(rx, ry); t.type = 'ruin'; t.h = Math.max(1, Math.min(t.h, 2)); }
  if (m.wet) for (const t of tiles) if (t.type === 'ice') t.type = 'lake';
  if (m.lichen) for (const t of tiles) if ((t.type === 'plain' || t.type === 'ore') && r() < m.lichen) t.lichen = 0.55 + r() * 0.45;
  // gentle lowlands near the front edge
  for (const t of tiles) if (t.type === 'plain' && t.h === 1 && t.gx + t.gy > 17 && r() < 0.5) t.h = 1;
  for (const [b, x, y] of L.prebuilt) {
    const t = T(x, y);
    if (b === 'mine') t.type = 'ore';
    else if (b === 'drill') t.type = 'ice';
    else { t.type = 'plain'; t.h = Math.min(Math.max(t.h, 1), 2); }
    t.b = b; t.basin = false; t.lichen = 0;
  }
  const pop = L.prebuilt.filter(([b]) => b === 'habitat').length * 4;
  return {
    level: li, time: 0, won: false,
    metal: L.start.metal, energy: L.start.energy, water: L.start.water, food: L.start.food, crystals: 0, pop,
    fed: 100, hyd: 100, mood: 65, relics: 0, relicIds: [], bonks: 0, trades: 0, bought: [], bonus: {},
    clock: 0, night: false, nights: 0, wave: 0, waveT: 0, critT: 20, traderT: 40, trader: null, arriveT: 1, leaveT: 15, vellT: 0,
    planet: { ...L.planet }, cometCd: 0, eff: 1,
    rates: { energy: 0, metal: 0, water: 0, food: 0, temp: 0, press: 0 },
    goalsDone: L.goals.map(() => false),
    tiles,
  };
}

// ---------------------------------------------------------------- simulation
function tick(dt) {
  S.time += dt;
  const L = LEVELS[S.level], bonus = S.bonus;
  if (L.dayNight) dayNight(dt);
  const sun = S.night ? 0.4 : 1;
  let prod = 0, cons = 0;
  for (const t of S.tiles) {
    if (t.off > 0) t.off = Math.max(0, t.off - dt);
    if (!t.b || t.off > 0) continue;
    const e = B[t.b].energy || 0;
    if (e > 0) prod += e * sun * (bonus.solar || 1); else cons -= e;
  }
  const avail = S.energy + prod * dt, need = cons * dt;
  let eff = 1;
  if (avail >= need) S.energy = Math.min(ECAP, avail - need);
  else { eff = need > 0 ? avail / need : 1; S.energy = 0; }
  S.eff = eff;

  const work = 0.75 + S.mood / 200; // happy colonists work faster
  let metal = 0, water = 0, food = 0, temp = 0, press = 0;
  for (const t of S.tiles) {
    if (!t.b || t.off > 0) continue;
    const d = B[t.b];
    if (d.out) {
      metal += (d.out.metal || 0) * eff * work * (bonus.metal || 1);
      water += (d.out.water || 0) * eff * work * (bonus.water || 1);
      food += (d.out.food || 0) * eff * work * (bonus.food || 1);
    }
    if (d.temp) temp += d.temp * eff;
    if (d.press) press += d.press * eff;
    if (t.b === 'dig') {
      t.prog = (t.prog || 0) + dt * eff / 20;
      if (t.prog >= 1) finishDig(t);
    }
  }
  temp += S.planet.press * 0.003; // thicker air traps a bit more heat

  // colonists eat and drink; restaurant meals go three times further
  const pop = S.pop;
  const served = Math.min(pop, count('restaurant') * B.restaurant.serve);
  const foodNeed = (pop - served) * 0.04 + served * 0.04 / 3, waterNeed = pop * 0.04;
  S.metal += metal * dt;
  S.water += water * dt;
  S.food += food * dt;
  const ate = Math.min(S.food, foodNeed * dt), drank = Math.min(S.water, waterNeed * dt);
  S.food -= ate; S.water -= drank;
  const fedRatio = foodNeed > 0 ? ate / (foodNeed * dt) : 1, hydRatio = waterNeed > 0 ? drank / (waterNeed * dt) : 1;
  S.fed = clamp(S.fed + (fedRatio > 0.999 ? 4 : -2.5 * (1 - fedRatio)) * dt, 0, 100);
  S.hyd = clamp(S.hyd + (hydRatio > 0.999 ? 4 : -2.5 * (1 - hydRatio)) * dt, 0, 100);
  if (S.fed < 50) say('bot', 'Our colonists are getting hungry. We need more food, so build another greenhouse.', 'hungry' + S.level);
  if (S.hyd < 50) say('bot', 'We’re running low on water, and people are getting thirsty. Build another ice drill.', 'thirsty' + S.level);

  // happiness: food and water, services, relic boosts, minus critters chewing on things
  let fun = 0;
  for (const k of SERVICES) {
    const n = count(k);
    if (n) fun += B[k].mood * (pop ? Math.min(1, n * B[k].serve / pop) : 1);
  }
  const pests = crits.filter(c => c.state === 'nibble').length;
  const target = clamp(50 + (S.fed - 60) * 0.3 + (S.hyd - 60) * 0.3 + fun + (bonus.mood || 0) - Math.min(16, pests * 4), 0, 100);
  S.mood = clamp(S.mood + clamp(target - S.mood, -2 * dt, 2 * dt), 0, 100);
  S.moodTarget = target;

  // settlers arrive when there is room and life is good, and leave when it isn't
  const cap = count('habitat') * 4;
  if (S.pop > cap) S.pop = cap;
  S.arriveT -= dt;
  if (S.pop < cap && S.mood >= 35 && S.arriveT <= 0) {
    S.pop++; S.arriveT = S.mood >= 70 ? 2.5 : 6;
    const homes = S.tiles.filter(t => t.b === 'habitat');
    if (homes.length) { const c = center(homes[Math.floor(Math.random() * homes.length)]); burst(c.x, c.y - 10, 6, ['#ffffff', '#ffd166']); }
  }
  if (S.mood < 20 && S.pop > 0) {
    S.leaveT -= dt;
    if (S.leaveT <= 0) {
      S.pop--; S.leaveT = 15;
      toast('A colonist got fed up and flew home.', 'bad');
      say('cmd', 'One of our colonists has packed up and gone home. If people stay unhappy, more will follow.', 'leave' + S.level);
    }
  } else S.leaveT = 15;
  let left = S.pop;
  for (const t of S.tiles) if (t.b === 'habitat') { t.res = Math.min(4, left); left -= t.res; }

  updateCritters(dt);
  if (L.traders) updateTrader(dt);
  if (S.vellT > 0) S.vellT -= dt;

  S.planet.temp = Math.min(22, S.planet.temp + temp * dt);
  S.planet.press = Math.min(60, S.planet.press + press * dt);
  S.rates = { energy: prod - cons, metal, water: water - waterNeed, food: food - foodNeed, temp, press };
  S.cometCd = Math.max(0, S.cometCd - dt);

  if (eff < 1 && !shortageWarned) {
    shortageWarned = true; toast('Power shortage: everything slows down. Build more solar arrays.', 'bad');
    say('eng', 'We’re using more power than we make, so everything has slowed down. Build more solar arrays, or recycle something.', 'short' + S.level);
  }
  if (eff >= 1 && S.energy > 10) shortageWarned = false;

  // thaw
  if (S.planet.temp >= 0) for (const t of S.tiles) {
    if (t.type === 'frozen' || t.type === 'ice') {
      if (t.type === 'ice' && t.b) continue; // drills keep their ice
      if (t.type === 'frozen') toastOnce('thaw', 'Crater ice is melting into lakes!', 'good');
      say('bot', 'We’re above zero and the ice is melting! Liquid water, open to the sky, for the first time in billions of years.', 'thaw');
      t.type = 'lake';
    }
  }

  if (S.planet.temp >= -10) say('kip', 'The snow on the mountains is melting. Fun fact: it was mostly frozen carbon dioxide, so now it is more atmosphere!', 'snow');
  if (S.planet.press >= 4) say('kip', 'Look up! Those are clouds. Real clouds, on Mars! I am taking several hundred photos.', 'clouds');

  // lichen
  const canGrow = S.planet.temp >= -20 && S.planet.press >= 5;
  if (canGrow && S.level === 1) say('bot', 'It’s warm enough and the air is thick enough for lichen now. Get a seeder down!', 'lichen-ok');
  if (canGrow) {
    const open = t => t && !t.b && (t.type === 'plain' || t.type === 'ore');
    for (const t of S.tiles) if (t.b === 'seeder') {
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const n = tileAt(t.gx + dx, t.gy + dy);
        if (open(n)) n.lichen = Math.min(1, n.lichen + 0.05 * eff * dt);
      }
    }
    for (const t of S.tiles) if (t.lichen >= 0.6) {
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = tileAt(t.gx + dx, t.gy + dy);
        if (open(n)) n.lichen = Math.min(1, n.lichen + 0.012 * dt);
      }
    }
  }
  S.planet.o2 = Math.min(21, S.planet.o2 + lichenTiles() * 0.0006 * dt);

  // goals
  L.goals.forEach((g, i) => {
    if (!S.goalsDone[i] && g.get() >= g.target) {
      S.goalsDone[i] = true; S.lastProgress = S.time;
      toast('Done: ' + g.text, 'good'); sfx('chime');
      const j = L.goals.findIndex((_, k) => !S.goalsDone[k]);
      if (j >= 0) { const n = L.goals[j]; say(n.who, PRAISE[n.who] + ' ' + n.hint, `hint-${S.level}-${j}`); }
    }
  });
  // nudge with the next objective when nothing has happened for a while
  if (!S.won && S.time - S.lastProgress > 55 && S.time - S.lastNudge > 70 && !talking && !talkQ.length) {
    S.lastNudge = S.time;
    const j = L.goals.findIndex((_, k) => !S.goalsDone[k]);
    if (j >= 0) say(L.goals[j].who, L.goals[j].hint);
  }
  if (!S.won && S.goalsDone.every(Boolean)) {
    S.won = true;
    try { localStorage.setItem('mmb-best', String(Math.max(S.level + 1, +localStorage.getItem('mmb-best') || 0))); } catch (e) {}
    saveGame();
    setTimeout(showComplete, 1400);
  }
}

// ---------------------------------------------------------------- day & night (level 3)
const DAY = 75, NIGHT = 35;
function dayNight(dt) {
  S.clock += dt;
  const night = S.clock % (DAY + NIGHT) >= DAY;
  if (night && !S.night) {
    S.night = true;
    S.wave = Math.min(9, 3 + S.nights * 2); S.waveT = 2;
    toast('Night is falling. Critters incoming!', 'bad');
    say('kip', 'Night is falling. Critter activity rising. I recommend zappers, and maybe a snack.', 'night1');
  } else if (!night && S.night) {
    S.night = false; S.nights++;
    toast('Dawn! The colony made it through the night.', 'good');
    say('cmd', 'We made it through the night. Good work, everyone.', 'dawn1');
  }
  if (S.night && S.wave > 0) {
    S.waveT -= dt;
    if (S.waveT <= 0) { if (spawnCritter()) S.wave--; S.waveT = 3.2; }
  }
}
// 0 at midday, 1 in the middle of the night, with a short dusk and dawn
function nightness() {
  if (!S || !LEVELS[S.level].dayNight) return 0;
  const ph = S.clock % (DAY + NIGHT);
  if (ph < DAY - 6) return 0;
  if (ph < DAY) return (ph - (DAY - 6)) / 6;
  if (ph > DAY + NIGHT - 6) return (DAY + NIGHT - ph) / 6;
  return 1;
}

// ---------------------------------------------------------------- critters
// Small native creatures. They climb out of craters, walk to a building, switch it off while
// they nibble, and run home with whatever they stole. Bonking one gets the loot back.
const LOOT = { greenhouse: 'food', restaurant: 'food', cafe: 'food', drill: 'water', park: 'water' };
function spawnCritter() {
  const targets = S.tiles.filter(t => t.b && t.b !== 'zapper');
  if (!targets.length) return false;
  const homes = S.tiles.filter(t => t.type === 'crater' || t.type === 'frozen' || (t.basin && t.type === 'lake'));
  let hx, hy;
  if (homes.length) { const h = homes[Math.floor(Math.random() * homes.length)]; hx = h.gx + 0.5; hy = h.gy + 0.5; }
  else { const e = Math.random() * N; [hx, hy] = Math.random() < 0.5 ? [e, N - 0.3] : [N - 0.3, e]; }
  const tgt = targets[Math.floor(Math.random() * targets.length)];
  crits.push({ x: hx, y: hy, hx, hy, ti: S.tiles.indexOf(tgt), state: 'emerge', t: 0, loot: {}, face: 1,
               col: Math.random() < 0.5 ? '#7fe0c4' : '#b79bff', seed: Math.random() * 10 });
  const first = [
    ['kip', 'Uh oh. Something just climbed out of that crater, and it looks hungry. Quick, tap it to bonk it!'],
    ['kip', 'The critters are back, and there are more of them this time. Remember, tap to bonk!'],
    ['eng', 'Critters spotted near the craters. Bonk them, or let the zappers handle it.'],
  ][S.level];
  say(first[0], first[1], 'crit1-' + S.level);
  return true;
}
function critTile(c) { return tileAt(clamp(Math.floor(c.x), 0, N - 1), clamp(Math.floor(c.y), 0, N - 1)); }
function critWorld(c) {
  const t = critTile(c);
  c.hs = c.hs == null ? t.h : c.hs + (t.h - c.hs) * 0.2;
  return { x: (c.x - c.y) * 32, y: (c.x + c.y) * 16 - c.hs * HZ };
}
function stepToward(c, tx, ty, dist) {
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
  if (d < 1e-6) return 0;
  const k = Math.min(1, dist / d);
  c.x += dx * k; c.y += dy * k;
  if (Math.abs(dx - dy) > 0.01) c.face = dx - dy > 0 ? 1 : -1;
  return d - dist;
}
function updateCritters(dt) {
  const L = LEVELS[S.level], cfg = L.critters;
  // daytime trickle (night waves are handled in dayNight)
  if (cfg && cfg.after()) {
    S.critT -= dt;
    const alive = crits.filter(c => c.state !== 'bonked').length;
    if (S.critT <= 0) {
      if (alive < cfg.max && !S.night) spawnCritter();
      S.critT = cfg.every[0] + Math.random() * (cfg.every[1] - cfg.every[0]);
    }
  }
  const speed = cfg ? cfg.speed : 0.7;
  for (const c of crits) {
    c.t += dt;
    const tgt = S.tiles[c.ti];
    if (c.state === 'emerge') { if (c.t > 0.7) { c.state = 'walk'; c.t = 0; } }
    else if (c.state === 'walk') {
      if (!tgt.b) { c.state = 'flee'; c.t = 0; continue; }
      if (stepToward(c, tgt.gx + 0.5, tgt.gy + 0.5, speed * dt) < 0.25) { c.state = 'nibble'; c.t = 0; }
    } else if (c.state === 'nibble') {
      if (!tgt.b) { c.state = 'flee'; c.t = 0; continue; }
      tgt.off = Math.max(tgt.off || 0, 0.3);
      const key = LOOT[tgt.b] || 'metal';
      const amt = Math.min(S[key], 1.2 * dt);
      S[key] -= amt; c.loot[key] = (c.loot[key] || 0) + amt;
      if (c.t > 7) { c.state = 'flee'; c.t = 0; }
    } else if (c.state === 'flee') {
      if (stepToward(c, c.hx, c.hy, speed * 1.25 * dt) <= 0.05) {
        c.gone = true;
        const [k, v] = Object.entries(c.loot)[0] || [];
        if (v > 0.5) {
          toast(`A critter got away with ${Math.round(v)} ${k}!`, 'bad');
          say('eng', 'One of those critters just ran off with our supplies. Keep an eye on them!', 'escape1');
        }
      }
    } else if (c.state === 'bonked') { if (c.t > 0.9) c.gone = true; }
  }
  // zappers
  for (const t of S.tiles) {
    if (t.b !== 'zapper' || t.off > 0) continue;
    t.cd = (t.cd || 0) - dt * S.eff * (S.bonus.zap || 1);
    if (t.cd > 0) continue;
    const prey = crits.find(c => c.state !== 'bonked' && Math.hypot(c.x - (t.gx + 0.5), c.y - (t.gy + 0.5)) <= 2.3);
    if (prey) {
      const a = center(t), b = critWorld(prey);
      fx.push({ kind: 'zap', x: a.x, y: a.y - 38, x2: b.x, y2: b.y - 8, life: 0.3, max: 0.3 });
      bonk(prey, true);
      t.cd = 1.4;
    }
  }
  crits = crits.filter(c => !c.gone);
}
function bonk(c, zapped = false) {
  if (c.state === 'bonked') return;
  c.state = 'bonked'; c.t = 0;
  for (const [k, v] of Object.entries(c.loot)) S[k] += v;
  c.loot = {};
  S.crystals += 1; S.bonks += 1; dirty = true;
  const p = critWorld(c);
  burst(p.x, p.y - 8, 10, ['#ffd166', '#ffffff', c.col]);
  fx.push({ kind: 'text', x: p.x, y: p.y - 22, text: '+1', life: 1, max: 1, color: '#9be3ff' });
  sfx(zapped ? 'zap' : 'bonk');
  say('kip', 'Bonk! It dropped a glowing crystal. I will keep that. For science.', 'bonk1');
}
function critterAt(mx, my) {
  let best = null, bd = Math.max(22, 16 * view.s);
  for (const c of crits) {
    if (c.state === 'bonked') continue;
    const p = critWorld(c), sx = view.x + p.x * view.s, sy = view.y + (p.y - 7) * view.s;
    const d = Math.hypot(mx - sx, my - sy);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

// ---------------------------------------------------------------- ruins & relics
function finishDig(t) {
  t.b = null; t.type = 'relic'; t.prog = 0; t.born = RT;
  S.relics++; dirty = true;
  const left = RELICS.filter(r => !S.relicIds.includes(r.id));
  const r = left.length ? left[Math.floor(Math.random() * left.length)] : null;
  const c = center(t);
  burst(c.x, c.y - 10, 26, ['#7ff7ff', '#c9a7ff', '#ffffff', '#ffd166'], 1.3);
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 8, life: 1, max: 1, color: '#7ff7ff', big: true });
  sfx('relic');
  if (r) {
    S.relicIds.push(r.id); r.apply(S);
    toast(`Relic found: ${r.name}!`, 'good');
    say(r.line[0], r.line[1]);
  }
  if (S.level === 2 && S.relics >= 3 && !S.vellDone) {
    S.vellDone = true; S.vellT = 26; S.vellAt = S.tiles.indexOf(t);
    shake = RM ? 0 : 10;
    for (const [w, txt] of VELL_LINES) say(w, txt);
  }
}

// ---------------------------------------------------------------- alien trader (level 3)
function updateTrader(dt) {
  const tr = S.trader;
  if (!tr) {
    S.traderT -= dt;
    if (S.traderT <= 0) {
      const spots = S.tiles.filter(t => !t.b && (t.type === 'plain' || t.type === 'ore'));
      if (!spots.length) { S.traderT = 20; return; }
      const spot = spots[Math.floor(Math.random() * spots.length)];
      const pool = OFFERS.filter(o => !(o.once && S.bought.includes(o.id))).sort(() => Math.random() - 0.5).slice(0, 3);
      S.trader = { i: S.tiles.indexOf(spot), phase: 'arrive', p: 0, t: 50, offers: pool.map(o => o.id) };
      toast('A flying saucer is landing! Click it to trade.', 'good');
      sfx('saucer');
      say('zorp', 'Greetings, soft builders! Zorp has come to trade. Zorp accepts water, snacks and shiny crystals.', 'trader1');
    }
    return;
  }
  if (tr.phase === 'arrive') { tr.p += dt / 2.5; if (tr.p >= 1) { tr.phase = 'wait'; tr.p = 0; } }
  else if (tr.phase === 'wait') { tr.t -= dt; if (tr.t <= 0) { tr.phase = 'leave'; tr.p = 0; } }
  else if (tr.phase === 'leave') { tr.p += dt / 2.5; if (tr.p >= 1) { S.trader = null; S.traderT = 70 + Math.random() * 30; } }
}
function saucerWorld() {
  const tr = S.trader, c = center(S.tiles[tr.i]);
  const lift = tr.phase === 'arrive' ? Math.pow(1 - tr.p, 2) * 320 : tr.phase === 'leave' ? Math.pow(tr.p, 2) * 320 : 0;
  return { x: c.x, y: c.y - 30 - lift + Math.sin(RT * 2) * 2.5, gx: c.x, gy: c.y };
}
function saucerAt(mx, my) {
  if (!S.trader || S.trader.phase !== 'wait') return false;
  const p = saucerWorld();
  return Math.hypot(mx - (view.x + p.x * view.s), my - (view.y + p.y * view.s)) < Math.max(28, 26 * view.s);
}
function showTrade() {
  const tr = S.trader;
  if (!tr) return;
  const offers = tr.offers.map(id => OFFERS.find(o => o.id === id)).filter(Boolean);
  openModal(`
    <span class="eyebrow" style="color:#b6f36a">Alien trader</span>
    <div class="trader"><canvas id="zorp-face" width="120" height="120"></canvas><div><h2>Zorp’s Wares</h2><p>“Zorp gives good deals. Mostly.” Pick one trade.</p></div></div>
    <div class="offers">${offers.map(o => `<button class="offer" data-id="${o.id}" ${afford(o.give) ? '' : 'disabled'}>
      <span class="give">Give <b>${costText(o.give)}</b></span><span class="arrow">→</span><span class="get">${o.get}</span></button>`).join('')}</div>
    <p class="small-note">You have ${Math.floor(S.crystals)} crystals, ${Math.floor(S.food)} food, ${Math.floor(S.water)} water. Bonk critters to collect crystals.</p>
    <div class="row"><button class="btn alt" id="later">Maybe later</button></div>`);
  const g = $('#zorp-face').getContext('2d'); g.scale(2, 2); drawPortrait(g, 'zorp', false, false);
  $('#later').addEventListener('click', closeModal);
  $('#modal').querySelectorAll('.offer').forEach(b => b.addEventListener('click', () => {
    const o = OFFERS.find(x => x.id === b.dataset.id);
    if (!afford(o.give)) return;
    for (const [k, v] of Object.entries(o.give)) S[k] -= v;
    o.apply(S); if (o.once) S.bought.push(o.id);
    S.trades++; dirty = true;
    tr.phase = 'leave'; tr.p = 0;
    closeModal();
    toast('Traded: ' + o.get, 'good'); sfx('chime');
    say('zorp', 'Pleasure doing business! Zorp will return. Zorp always returns.', 'trade1');
  }));
}

// ---------------------------------------------------------------- actions
const afford = c => Object.entries(c).every(([k, v]) => S[k] >= v);
const costText = c => {
  const e = Object.entries(c);
  return e.length ? e.map(([k, v]) => `${v} ${k}`).join(' · ') : '½ metal back';
};

function canPlace(name, t) {
  if (!t) return [false, ''];
  const d = B[name];
  if (name === 'recycle') return t.b ? [true, ''] : [false, 'Nothing to recycle here.'];
  if (name === 'comet') {
    if (t.b) return [false, 'A comet would flatten that building.'];
    if (t.type === 'rock') return [false, 'Aim for open ground or a crater.'];
    if (S.cometCd > 0) return [false, `Next comet arrives in ${Math.ceil(S.cometCd)} s.`];
  } else {
    if (t.b) return [false, 'This tile already has a building.'];
    if (!d.on.includes(t.type)) return [false, d.onText];
  }
  if (!afford(d.cost)) {
    const miss = Object.entries(d.cost).filter(([k, v]) => S[k] < v).map(([k, v]) => `${Math.ceil(v - S[k])} more ${k}`);
    return [false, 'Need ' + miss.join(' and ') + '.'];
  }
  return [true, ''];
}

function place(name, t) {
  const [ok, why] = canPlace(name, t);
  if (!ok) { if (why) toast(why, 'bad'); sfx('nope'); return; }
  const d = B[name];
  for (const [k, v] of Object.entries(d.cost)) S[k] -= v;
  dirty = true; S.lastProgress = S.time;
  const c = center(t);
  if (name === 'recycle') {
    const refund = Math.floor((B[t.b].cost.metal || 0) / 2);
    S.metal += refund;
    t.b = null;
    burst(c.x, c.y - 8, 14, ['#ffd166', '#b8afd8', '#ffffff']);
    toast(`Recycled for ${refund} metal`); sfx('pop');
    return;
  }
  if (name === 'comet') {
    S.cometCd = COMET_CD;
    comets.push({ t, p: 0 });
    toast('Comet inbound!'); sfx('whoosh');
    return;
  }
  t.b = name; t.born = RT;
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 6, life: 0.6, max: 0.6, color: '#ffffff' });
  burst(c.x, c.y, 8, ['#ffd7b8', '#ffffff']);
  sfx('build');
}

function cometImpact(t) {
  const c = center(t);
  dirty = true;
  S.planet.press += 2.5;
  S.planet.temp = Math.min(22, S.planet.temp + 1.5);
  if (t.type === 'crater' || t.type === 'frozen') {
    t.type = S.planet.temp >= 0 ? 'lake' : 'frozen';
  } else if (t.type === 'plain' || t.type === 'ore') {
    t.type = 'crater'; t.h = 0; t.basin = true; t.lichen = 0;
  }
  shake = RM ? 0 : 14;
  fx.push({ kind: 'flash', life: 0.35, max: 0.35 });
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 10, life: 0.9, max: 0.9, color: '#ffffff', big: true });
  fx.push({ kind: 'ring', x: c.x, y: c.y, r: 6, life: 1.2, max: 1.2, color: '#9be3ff', big: true });
  burst(c.x, c.y - 4, 34, ['#ff9a6a', '#ffd166', '#9be3ff', '#ffffff', '#c4552d'], 1.8);
  for (let i = 0; i < 6; i++) fx.push(puff(c.x + (Math.random() - .5) * 40, c.y - 6, '#f3d9cf', 1.6));
  sfx('boom');
  say('kip', 'Direct hit! Atmosphere: slightly thicker. Crater: slightly bigger. Me: extremely happy.', 'comet1');
  toast(t.type === 'frozen' ? 'Splash! The crater filled with ice. Warm Mars above 0 °C to melt it.'
      : t.type === 'lake' && t.basin ? 'Splash! A new crater lake.' : '+2.5 kPa of fresh atmosphere', 'good');
}

// ---------------------------------------------------------------- effects
function puff(x, y, color, scale = 1) {
  return { kind: 'puff', x, y, vx: (Math.random() - 0.3) * 6, vy: -10 - Math.random() * 8, r: 3 * scale, grow: 5 * scale, life: 2.4, max: 2.4, color };
}
function burst(x, y, n, colors, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (30 + Math.random() * 60) * power;
    fx.push({ kind: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 40 * power, r: 1.2 + Math.random() * 2.2, life: 0.8 + Math.random() * 0.5, max: 1.3, color: colors[i % colors.length], g: 140 });
  }
}

let emitT = 0;
function updateFX(dt, simDt) {
  // emitters from buildings
  emitT += simDt;
  if (emitT > 0.45) {
    emitT = 0;
    for (const t of S.tiles) {
      if (!t.b || S.eff <= 0.05) continue;
      const c = center(t);
      if (t.b === 'factory') {
        fx.push(puff(c.x - 7, c.y - 32, Math.random() < 0.5 ? '#ffb3c1' : '#ffcfa8'));
        if (Math.random() < 0.6) fx.push(puff(c.x + 4, c.y - 31, '#ffc2cf'));
      } else if (t.b === 'mine' && Math.random() < 0.35) {
        fx.push({ ...puff(c.x + 12, c.y + 2, '#d98b62', 0.5), life: 1.2, max: 1.2 });
      } else if (t.b === 'seeder' && S.planet.temp >= -20 && S.planet.press >= 5 && Math.random() < 0.6) {
        fx.push({ kind: 'dot', x: c.x + (Math.random() - .5) * 10, y: c.y - 10, vx: (Math.random() - .5) * 30, vy: -14, r: 1.5, life: 1.8, max: 1.8, color: '#9cf0bd', g: -4 });
      }
    }
  }
  for (const p of fx) {
    p.life -= dt;
    if (p.kind === 'puff') { p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.grow * dt; p.vy *= 0.99; }
    else if (p.kind === 'dot') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= 0.98; }
    else if (p.kind === 'ring') { p.r += (p.big ? 120 : 50) * dt; }
  }
  fx = fx.filter(p => p.life > 0);
  for (const c of comets) c.p += dt / 1.3;
  for (const c of comets) if (c.p >= 1 && !c.hit) { c.hit = true; cometImpact(c.t); }
  comets = comets.filter(c => !c.hit);
  for (const c of clouds) { c.x += c.spd * dt; if (c.x > 460) c.x = -460; }
  shake = Math.max(0, shake - dt * 30);
}

// ---------------------------------------------------------------- geometry
function center(t) { return { x: (t.gx - t.gy) * 32, y: (t.gx + t.gy + 1) * 16 - t.h * HZ }; }
function silhouette(t) {
  const c = center(t), d = t.h * HZ + BASE;
  return [[c.x, c.y - 16], [c.x + 32, c.y], [c.x + 32, c.y + d], [c.x, c.y + 16 + d], [c.x - 32, c.y + d], [c.x - 32, c.y]];
}
function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function pick(mx, my) {
  const wx = (mx - view.x) / view.s, wy = (my - view.y) / view.s;
  for (let i = order.length - 1; i >= 0; i--) if (inPoly(wx, wy, silhouette(order[i]))) return order[i];
  return null;
}

function layout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const top = $('.top').getBoundingClientRect().bottom + 8;
  const bot = $('.bottom').getBoundingClientRect().top - 4;
  const availH = Math.max(160, bot - top), availW = W - 16;
  const bw = N * 64, bh = N * 32 + BASE + 3 * HZ + 50;
  const s = Math.min(availW / bw, availH / bh, 1.6);
  $('#toasts').style.top = top + 'px';
  $('#talk').style.bottom = (H - $('.bottom').getBoundingClientRect().top + 10) + 'px';
  view = { W, H, dpr, s, x: W / 2, y: top + (availH - bh * s) / 2 + (3 * HZ + 50) * s };
}

function terra() {
  const p = S.planet;
  return clamp((p.press - 0.6) / 12, 0, 1) * 0.6 + clamp((p.temp + 63) / 63, 0, 1) * 0.4;

function drawTile(g, t) {
  const c = center(t), d = t.h * HZ + BASE;

  if (t.type === 'plain' || t.type === 'ore' || t.type === 'rock' || t.type === 'crater') top = shade(top, (t.v - 0.5) * 0.08);
  if (t.lichen > 0) top = mix(top, '#4cb878', t.lichen * 0.8);
  const N_ = [c.x, c.y - 16], E = [c.x + 32, c.y], S_ = [c.x, c.y + 16], W = [c.x - 32, c.y];
  const left = t.type === 'ice' ? pal[1] : PAL.plain[1], right = t.type === 'ice' ? pal[2] : PAL.plain[2];
  g.fillStyle = left;  poly(g, [W, S_, [S_[0], S_[1] + d], [W[0], W[1] + d]]);
  g.fillStyle = right; poly(g, [S_, E, [E[0], E[1] + d], [S_[0], S_[1] + d]]);

  g.fillStyle = '#7d3326'; poly(g, [[W[0], W[1] + d - bd], [S_[0], S_[1] + d - bd], [S_[0], S_[1] + d], [W[0], W[1] + d]]);
  g.fillStyle = '#672a22'; poly(g, [[S_[0], S_[1] + d - bd], [E[0], E[1] + d - bd], [E[0], E[1] + d], [S_[0], S_[1] + d]]);
  if (t.type === 'ice') { // ice sheet sits on rock
    g.fillStyle = PAL.plain[1]; poly(g, [[W[0], W[1] + 6], [S_[0], S_[1] + 6], [S_[0], S_[1] + d - bd], [W[0], W[1] + d - bd]]);
    g.fillStyle = PAL.plain[2]; poly(g, [[S_[0], S_[1] + 6], [E[0], E[1] + 6], [E[0], E[1] + d - bd], [S_[0], S_[1] + d - bd]]);
  }
  g.fillStyle = top; poly(g, [N_, E, S_, W]);
  g.strokeStyle = 'rgba(80,20,20,0.10)'; g.lineWidth = 1; g.stroke();
  g.save(); g.translate(c.x, c.y); decorate(g, t); g.restore();
}

function decorate(g, t) {

      if (v > 0.6) { ell(g, 9 - v * 6, 4, 1.8, 1, 'rgba(120,35,20,0.25)'); ell(g, 9 - v * 6, 3.4, 1.5, 0.9, '#f59a6b'); }
      if (v < 0.18) { g.strokeStyle = 'rgba(140,45,25,0.35)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(4, 1, 7, 3.2, 0, 0, Math.PI * 2); g.stroke(); }
      break;
    }

        g.fillStyle = '#7a5fd0'; poly(g, [[x - 3, y], [x - 3, y - h], [x, y - h - 4], [x + 3, y - h], [x + 3, y]]);

    case 'lake': {

      else { g.fillStyle = '#3fa2f2'; poly(g, [[0, -12], [24, 0], [0, 12], [-24, 0]]); }
      g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 1.2; g.lineCap = 'round';

      g.fillStyle = '#5f5d86'; poly(g, [[-13, 3], [-13, -14], [-7, -22], [-7, 3]]);

function drawColonists(g, t, front) {

function drawCritter(g, c) {
  const p = critWorld(c);
  const walking = c.state === 'walk' || c.state === 'flee';
  let k = 1, alpha = 1;
  if (c.state === 'emerge') k = easeBack(clamp(c.t / 0.7, 0, 1));
  if (c.state === 'bonked') { alpha = clamp(1.4 - c.t * 1.5, 0, 1); }
  const bob = walking ? Math.abs(Math.sin(c.t * 13 + c.seed)) * 3 : c.state === 'nibble' ? Math.abs(Math.sin(c.t * 22)) * 1.2 : 0;
  g.save(); g.translate(p.x, p.y); g.globalAlpha = alpha;
  ell(g, 0, 1, 7 * k, 2.6 * k, 'rgba(70,16,24,0.25)');
  g.scale(k * c.face, k);
  const by = -7 - bob, dark = shade(c.col, -0.25);
  if (c.state === 'bonked') g.scale(1.15, 0.8 + 0.1 * Math.sin(c.t * 20));

  ell(g, -4, by - 11.5, 1.6, 1.6, '#ffd166'); ell(g, 5, by - 10.5, 1.6, 1.6, '#ffd166');

  ell(g, -3.5, by - 1, 1.6, 1, 'rgba(255,120,150,0.4)');
  if (c.state === 'bonked') {
    g.strokeStyle = '#1a1238'; g.lineWidth = 1.2;
    for (const ex of [0.5, 5]) { g.beginPath(); g.moveTo(ex - 1.5, by - 4.5); g.lineTo(ex + 1.5, by - 1.5); g.moveTo(ex + 1.5, by - 4.5); g.lineTo(ex - 1.5, by - 1.5); g.stroke(); }
    for (let i = 0; i < 3; i++) { const a = c.t * 8 + i * 2.1; ell(g, Math.cos(a) * 8, by - 11 + Math.sin(a) * 2.5, 1.5, 1.5, '#ffd166'); }

}

    const a = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'puff') { ell(g, p.x, p.y, p.r, p.r * 0.85, rgba(p.color, a * 0.75)); }
    else if (p.kind === 'dot') { ell(g, p.x, p.y, p.r, p.r, rgba(p.color, Math.min(1, a * 1.5))); }
    else if (p.kind === 'ring') { g.strokeStyle = rgba(p.color, a * 0.8); g.lineWidth = p.big ? 3 : 2; g.beginPath(); g.ellipse(p.x, p.y, p.r, p.r * 0.5, 0, 0, Math.PI * 2); g.stroke(); }
    else if (p.kind === 'text') { g.fillStyle = rgba(p.color, a); g.font = '600 12px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText(p.text, p.x, p.y - (1 - a) * 16); }
    else if (p.kind === 'zap') {
      g.save(); g.globalCompositeOperation = 'lighter';
      for (const [w, col] of [[5, 'rgba(155,227,255,0.35)'], [2, '#ffffff']]) {
        g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = a; g.beginPath(); g.moveTo(p.x, p.y);
        for (let i = 1; i < 6; i++) { const f = i / 6; g.lineTo(lerp(p.x, p.x2, f) + (Math.random() - 0.5) * 9, lerp(p.y, p.y2, f) + (Math.random() - 0.5) * 9); }
        g.lineTo(p.x2, p.y2); g.stroke();
      }
      g.restore();
    }
  }
}

function drawComets(g) {
  for (const cm of comets) {
    const c = center(cm.t);
    const sx = c.x + 330, sy = c.y - 520;
    const e = cm.p * cm.p;
    const x = lerp(sx, c.x, e), y = lerp(sy, c.y, e);
    const dx = sx - c.x, dy = sy - c.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const tail = 150;
    const grd = g.createLinearGradient(x, y, x + ux * tail, y + uy * tail);
    grd.addColorStop(0, 'rgba(200,240,255,0.95)'); grd.addColorStop(1, 'rgba(120,200,255,0)');
    g.fillStyle = grd;
    poly(g, [[x - uy * 7, y + ux * 7], [x + uy * 7, y - ux * 7], [x + ux * tail, y + uy * tail]]);
    ell(g, x, y, 12, 12, 'rgba(155,227,255,0.35)');
    ell(g, x, y, 7, 7, '#ffffff');
    // target reticle
    g.strokeStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(RT * 12)})`; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(c.x, c.y, 26, 13, 0, 0, Math.PI * 2); g.stroke();
  }
}

function cloudShape(g, x, y, s, col) {
  ell(g, x, y, 40 * s, 12 * s, col);
  ell(g, x - 16 * s, y - 7 * s, 17 * s, 13 * s, col);
  ell(g, x + 6 * s, y - 13 * s, 21 * s, 17 * s, col);
  ell(g, x + 24 * s, y - 4 * s, 14 * s, 10 * s, col);
}
function drawClouds(g) {
  const a = clamp((S.planet.press - 3) / 9, 0, 1) * 0.85;
  if (a <= 0.01) return;
  for (const c of clouds) {
    const fade = clamp((460 - Math.abs(c.x)) / 120, 0, 1);
    g.save(); g.globalAlpha = a * fade;
    // shadow on the ground
    ell(g, c.x + 10, c.y + 120, 44 * c.s, 14 * c.s, 'rgba(60,20,40,0.12)');
    cloudShape(g, c.x, c.y, c.s, '#dfe9ff');
    cloudShape(g, c.x, c.y - 3 * c.s, c.s * 0.92, '#ffffff');
    g.restore();
  }
}

function drawGhost(g) {
  if (!hover || !tool) return;
  const [ok] = canPlace(tool, hover);
  const c = center(hover);
  g.save(); g.translate(c.x, c.y);
  g.fillStyle = ok ? 'rgba(120,255,180,0.28)' : 'rgba(255,80,110,0.3)';
  poly(g, [[0, -16], [32, 0], [0, 16], [-32, 0]]);
  g.strokeStyle = ok ? '#a8ffd0' : '#ff8aa0'; g.lineWidth = 2; g.stroke();
  if (tool === 'comet') {
    g.strokeStyle = ok ? '#ffffff' : '#ff8aa0'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2); g.moveTo(-28, 0); g.lineTo(-14, 0); g.moveTo(14, 0); g.lineTo(28, 0); g.stroke();
  } else if (tool === 'recycle') {
    if (hover.b) { g.globalAlpha = 0.9; g.scale(0.6, 0.6); DRAW.recycle(g); }
  } else if (!hover.b) {
    g.globalAlpha = ok ? 0.65 : 0.4; DRAW[tool](g, RT, 0.5);
  }
  g.restore();
}

function drawBG(g, W, H) {
  const p = S ? terra() : 0;
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, mix('#120d30', '#10204a', p));
  grd.addColorStop(1, mix('#2b1748', '#1c3a68', p));
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = s.a * (RM ? 0.8 : 0.6 + 0.4 * Math.sin(RT * s.f + s.p));
    ell(g, s.x * W, s.y * H, s.z, s.z, `rgba(255,248,235,${a})`);
  }
  // the Sun, small and far away
  const sx = W * 0.1, sy = H * 0.16;
  const sg = g.createRadialGradient(sx, sy, 4, sx, sy, 120);
  sg.addColorStop(0, 'rgba(255,230,170,0.55)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = sg; g.fillRect(sx - 120, sy - 120, 240, 240);
  ell(g, sx, sy, 11, 11, '#fff3d6');
  // Phobos drifting by
  const px = ((RT * 9) % (W + 200)) - 100, py = H * 0.3 + Math.sin(RT * 0.05) * 20;
  g.save(); g.translate(px, py); g.rotate(0.3);
  ell(g, 0, 0, 9, 6.5, '#8d7f8f'); ell(g, -2, -1.5, 6, 4, '#a89aa8'); ell(g, 3, 1, 1.6, 1.1, '#6f6272');
  g.restore();
}

function render() {
  const { W, H, dpr, s } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBG(ctx, W, H);
  if (!S) return;
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(view.x + sx, view.y + sy); ctx.scale(s, s);
  drawHalo(ctx);
  const byTile = new Map();
  for (const c of crits) { const k = critTile(c); if (!byTile.has(k)) byTile.set(k, []); byTile.get(k).push(c); }
  for (const t of order) {
    drawTile(ctx, t);
    if (t.b) drawBuildingOn(ctx, t);
    const cs = byTile.get(t); if (cs) for (const c of cs) drawCritter(ctx, c);
  }
  if (hover && !tool) {
    const c = center(hover);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 16); ctx.lineTo(c.x + 32, c.y); ctx.lineTo(c.x, c.y + 16); ctx.lineTo(c.x - 32, c.y); ctx.closePath(); ctx.stroke();
  }
  drawGhost(ctx);
  drawBeams(ctx);
  drawFX(ctx);
  drawSaucer(ctx);
  drawVell(ctx);
  drawClouds(ctx);
  drawComets(ctx);
  const nf = nightness();
  if (nf > 0.01) {
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgba(10,14,48,${0.5 * nf})`; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  drawLights(ctx, nf);
  for (const p of fx) if (p.kind === 'flash') {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgba(255,250,235,${(p.life / p.max) * 0.55})`; ctx.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- UI
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 420); }, 2600);
}
const once = new Set();
function toastOnce(key, msg, kind) { if (once.has(key)) return; once.add(key); toast(msg, kind); }

function buildToolbar() {
  const bar = $('#toolbar'); bar.innerHTML = '';
  const L = LEVELS[S.level];
  L.tools.forEach((name, i) => {
    const d = B[name];
    const btn = document.createElement('button');
    btn.className = 'tool'; btn.id = 'tool-' + name; btn.dataset.tool = name;
    btn.setAttribute('aria-label', `${d.name}, ${costText(d.cost)}`);
    const cnv = document.createElement('canvas');
    const dpr = 2; cnv.width = 58 * dpr; cnv.height = 46 * dpr;
    const g = cnv.getContext('2d'); g.scale(dpr, dpr); g.translate(29, 34); g.scale(0.85, 0.85);
    if (!d.ability) { g.fillStyle = 'rgba(255,255,255,0.08)'; poly(g, [[0, -14], [28, 0], [0, 14], [-28, 0]]); }
    DRAW[name](g, 0.6, 0.3);
    btn.innerHTML = i < 10 ? `<kbd>${(i + 1) % 10}</kbd>` : '';
    btn.appendChild(cnv);
    btn.insertAdjacentHTML('beforeend', `<span class="nm">${d.name}</span><span class="cost">${costText(d.cost).replace(' · ', '<br>')}</span>`);
    btn.addEventListener('click', () => selectTool(tool === name ? null : name));

  });
}

const talkQ = [];

// Fallback only: used when a recorded clip can't be played. Prefers the device's most natural voices.
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Princess|eSpeak/i;
function voiceScore(v, c) {
  let s = 0;
  if (/Natural|Neural|Premium|Enhanced|Siri|Online/i.test(v.name)) s += 100;
  if (/Google/i.test(v.name)) s += 40;
  const i = c.prefs.findIndex(n => v.name.includes(n));
  if (i >= 0) s += 30 - i;
  if (NOVELTY.test(v.name)) s -= 1000;
  return s;
}
function assignVoices() {
  if (!TTS) return;
  const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  const used = new Set();
  for (const c of Object.values(CREW)) {
    const ranked = voices.slice().sort((a, b) => voiceScore(b, c) - voiceScore(a, c));
    const v = ranked.find(x => !used.has(x.name)) || ranked[0] || null;
    if (v) used.add(v.name);
    c.voice = v;

  dl.delayTime.value = EIGHTH * 3; fb.gain.value = 0.42; tone.type = 'lowpass'; tone.frequency.value = 3200;
  M.bells.connect(dl); dl.connect(tone); tone.connect(fb); fb.connect(dl);
  const bellOut = bus(0.7, 0.8); M.bells.connect(bellOut); tone.connect(bellOut);
  // lead and low end
  M.lead = AC.createBiquadFilter(); M.lead.type = 'lowpass'; M.lead.frequency.value = 2400;
  M.lead.connect(bus(0.6, 0.85));
  M.low = bus(0.9, 0.25);
  M.next = t + 0.15; M.step = 0;
  M.timer = setInterval(musicTick, 200);
  musicTick();
}
function musicStop() {
  if (!M.timer) return;
  clearInterval(M.timer); M.timer = null;
  const out = M.out, lfos = M.lfos, t = AC.currentTime;
  M.lfos = [];
  out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), t);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  setTimeout(() => { lfos.forEach(o => o.stop()); out.disconnect(); }, 1600);
}
function voice(type, freq, t, attack, hold, release, vol, dest, detune = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; o.detune.value = detune;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.setValueAtTime(vol, t + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + attack + hold + release + 0.05);
  return o;
}
// glassy FM bell: the modulator's brightness decays faster than the tone itself
function bell(m, t, vel, pan) {
  const f = midi(m), car = AC.createOscillator(), mod = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain(), pn = panner(pan);
  car.frequency.value = f; mod.frequency.value = f * 3.5;
  mg.gain.setValueAtTime(f * 2.2 * vel, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 1.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 * vel, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
  mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(pn); pn.connect(M.bells);
  car.start(t); mod.start(t); car.stop(t + 2.7); mod.stop(t + 2.7);
}
// lead: a soft, breathy reed with delayed vibrato
function lead(m, t, dur) {
  const f = midi(m), g = AC.createGain(), vib = AC.createOscillator(), vg = AC.createGain();
  vib.frequency.value = 5.2; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(9, t + Math.min(0.6, dur * 0.6));
  vib.connect(vg);
  const oscs = [['triangle', 1, 0, 1], ['sine', 2, 3, 0.25], ['sawtooth', 1, -4, 0.08]].map(([type, mult, det, lvl]) => {
    const o = AC.createOscillator(), og = AC.createGain();
    o.type = type; o.frequency.value = f * mult; o.detune.value = det; og.gain.value = lvl;
    vg.connect(o.detune); o.connect(og); og.connect(g); return o;
  });
  const end = t + dur;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.14);
  g.gain.setValueAtTime(0.06, Math.max(t + 0.15, end - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, end + 0.9);
  g.connect(M.lead);
  for (const o of [...oscs, vib]) { o.start(t); o.stop(end + 1); }
}
function timpani(root, t, vol) {
  const f = midi(root - 12), o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.09);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  o.connect(g); g.connect(M.low); o.start(t); o.stop(t + 1.9);
}
function whoosh(t) {
  const d = 8, len = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain(), pn = panner(-0.8);
  src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 10;
  bp.frequency.setValueAtTime(220, t); bp.frequency.exponentialRampToValueAtTime(2400, t + d * 0.55); bp.frequency.exponentialRampToValueAtTime(350, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + d * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  if (pn.pan) pn.pan.linearRampToValueAtTime(0.8, t + d);
  src.connect(bp); bp.connect(g); g.connect(pn); pn.connect(M.verb);
  src.start(t); src.stop(t + d);
}
function musicTick() {
  if (!AC || AC.state !== 'running' || !M.timer) return;
  const now = AC.currentTime, p = S ? terra() : 0;
  M.str.frequency.setTargetAtTime(900 + p * 1600, now, 3);
  M.lead.frequency.setTargetAtTime(2000 + p * 1600, now, 3);
  while (M.next < now + 1.2) {
    const t = M.next, step = M.step;
    const cyc = Math.floor(step / 64), plan = PLAN[cyc === 0 ? 0 : 1 + (cyc - 1) % 7];
    const inCyc = step % 64, bar = Math.floor(inCyc / 8), eighth = inCyc % 8;
    const [root, ch] = plan.prog[bar];
    const chordStart = eighth === 0 && bar % 2 === 0, barLen = 8 * EIGHTH;
    if (chordStart) {
      const len = barLen * 2;
      // drone: root two octaves down, plus a soft fifth
      voice('sine', midi(root - 12), t, 1.5, len - 1, 2.5, 0.16, M.low);
      voice('triangle', midi(root - 12), t, 2, len - 1.5, 2.5, 0.05, M.low, 4);
      voice('sine', midi(root - 5), t, 3, len - 2.5, 3, 0.03, M.low);
      if (plan.choir) for (const n of ch) for (const d of [-7, 7]) voice('sawtooth', midi(n), t, 2.4, len - 2, 3.5, 0.016, M.choir, d);
      if (plan.strings) for (const n of ch) for (const d of [-10, 10]) voice('sawtooth', midi(n - 12), t, 3.2, len - 3, 3.5, 0.011, M.str, d);
      if (plan.high && Math.random() < 0.7) {
        const pn = panner(Math.random() * 1.6 - 0.8); pn.connect(M.verb);
        voice('sine', midi(ch[Math.floor(Math.random() * ch.length)] + 24), t + BEAT * 2, 2.5, 1.5, 4, 0.016, pn);
      }
      if (bar === 0 && cyc % 2 === 1) whoosh(t + BEAT);
    }
    // the incantation: chord tones up an octave, a 6-step figure across 8-step bars
    if (plan.bells) {
      const k = SPELL[step % SPELL.length], up = (Math.floor(step / 24) % 3 === 2) ? 24 : 12;
      const accent = eighth === 0 ? 1 : eighth === 4 ? 0.8 : 0.55;
      if (Math.random() < plan.bells * (0.8 + p * 0.2)) bell(ch[k] + up, t, accent, Math.sin(step * 0.39) * 0.75);
    }
    if (plan.timp && eighth === 0) timpani(root, t, bar % 2 === 0 ? 0.22 : 0.12);
    if (plan.timp && inCyc === 62) { timpani(root, t, 0.1); timpani(root, t + EIGHTH, 0.16); }
    if (plan.theme && eighth % 2 === 0) {
      const beat = inCyc / 2;
      for (const [b, n, l] of plan.theme) if (b === beat) lead(n, t, l * BEAT * 0.96);
    }
    M.step++; M.next += EIGHTH;
  }
}
function tone(f, d, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (!AC || !prefs.sfx) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, vol, freq) {
  if (!AC || !prefs.sfx) return;
  const len = AC.sampleRate * d, buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(sfxBus); src.start();
}
function sfx(k) {
  switch (k) {
    case 'build': tone(520, 0.12, 'triangle', 0.12, 260); tone(880, 0.1, 'sine', 0.06, 0, 0.06); break;
    case 'pop': tone(400, 0.12, 'triangle', 0.1, -200); break;
    case 'tick': tone(1200, 0.03, 'sine', 0.03); break;
    case 'nope': tone(200, 0.14, 'square', 0.04, -60); break;
    case 'whoosh': noise(1.2, 0.08, 1800); break;
    case 'boom': noise(1.4, 0.45, 500); tone(90, 0.8, 'sine', 0.3, -50); break;
    case 'chime': [660, 880, 1320].forEach((f, i) => tone(f, 0.3, 'sine', 0.08, 0, i * 0.08)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'triangle', 0.09, 0, i * 0.12)); break;
    case 'bonk': tone(620, 0.14, 'square', 0.06, -380); tone(1300, 0.08, 'sine', 0.05, 0, 0.05); break;
    case 'zap': noise(0.18, 0.12, 5000); tone(1500, 0.15, 'sawtooth', 0.04, -1000); break;
    case 'relic': [392, 523, 659, 880].forEach((f, i) => tone(f, 0.9, 'sine', 0.06, 0, i * 0.09)); break;
    case 'saucer': tone(260, 1.6, 'sine', 0.06, 520); tone(268, 1.6, 'triangle', 0.04, 540); break;
  }
}

// ---------------------------------------------------------------- input
let hoverThing = null;
function setHover(e) {
  if (!S) return;
  const thing = saucerAt(e.clientX, e.clientY) ? 'saucer' : critterAt(e.clientX, e.clientY) ? 'critter' : null;
  const t = pick(e.clientX, e.clientY);
  if (t !== hover || thing !== hoverThing) { hover = t; hoverThing = thing; showTip(); }
  cv.style.cursor = thing ? 'pointer' : '';
}
cv.addEventListener('pointermove', setHover);
cv.addEventListener('pointerleave', () => { hover = null; showTip(); });
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (!S || modalOpen) return;
  if (e.button === 2) { selectTool(null); return; }
  if (saucerAt(e.clientX, e.clientY)) { showTrade(); return; }
  const crit = critterAt(e.clientX, e.clientY);
  if (crit) { bonk(crit); return; }
  setHover(e);
  if (!hover) return;
  if (tool) { place(tool, hover); showTip(); }
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (modalOpen || !S) return;
  if (e.key === 'Escape') selectTool(null);
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (e.key === 'm' || e.key === 'M') toggleMusic();
  else if (e.key === 'v' || e.key === 'V') toggleVoice();
  else if (e.key === 'Enter' && talking) skipLine();
  else if (/^[0-9]$/.test(e.key)) { const n = LEVELS[S.level].tools[(+e.key + 9) % 10]; if (n) selectTool(tool === n ? null : n); }
});
function togglePause() { paused = !paused; const b = $('#btn-pause'); b.textContent = paused ? '▶' : '❚❚'; b.classList.toggle('on', paused); }
$('#btn-pause').addEventListener('click', togglePause);
$('#btn-speed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('#btn-speed').textContent = speed + '×'; $('#btn-speed').classList.toggle('on', speed > 1); });
function syncAudioButtons() {
  for (const [id, key, label] of [['#btn-music', 'music', 'Music'], ['#btn-sound', 'sfx', 'Sound effects and voices']]) {
    const b = $(id), on = prefs[key];
    b.classList.toggle('off', !on); b.setAttribute('aria-pressed', String(on));
    b.title = `${label}: ${on ? 'on' : 'off'}${key === 'music' ? ' (M)' : ' (V)'}`;
  }
}
function toggleMusic() {
  prefs.music = !prefs.music; savePrefs(); syncAudioButtons();
  if (prefs.music) { audioInit(); musicStart(); } else musicStop();
  toast(prefs.music ? 'Music on' : 'Music off');
}
$('#btn-music').addEventListener('click', toggleMusic);
$('#btn-sound').addEventListener('click', toggleVoice);
syncAudioButtons();
addEventListener('resize', layout);
$('#goals').addEventListener('toggle', () => requestAnimationFrame(layout));

// ---------------------------------------------------------------- loop
let last = performance.now(), uiT = 0, saveT = 0, dirty = false;
function frame(now) {
  const rdt = Math.min(0.1, (now - last) / 1000); last = now; RT += rdt;
  const running = S && !paused && !modalOpen;
  const simDt = running ? rdt * speed : 0;
  if (running) tick(simDt);
  if (S) updateFX(running ? rdt * Math.min(speed, 2) : rdt * 0.3, simDt);
  talkUpdate(rdt);
  uiT += rdt;
  if (uiT > 0.12 && S) { uiT = 0; updateUI(); layout(); }
  saveT += rdt;
  if (playing && (dirty || (saveT > 5 && running))) saveGame();
  render();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- boot
function boot(data) {
  initStars(); initClouds();
  if (innerWidth < 720) $('#goals').open = false; // phones: objectives fold into the level title
  if (data && data.S) {
    S = data.S; for (const t of S.tiles) t.born = -9;
    afterLoad();
    playing = !!data.playing;
    if (data.modal === false) closeModal(); else showTitle();
  } else {
    const save = readSave();
    if (save) loadSave(save); else { S = newState(0); afterLoad(); }
    playing = false;   // stay on the title screen until the player picks Continue or a level
    $('#saved').textContent = 'Progress saves automatically';
    showTitle();
  }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ S, modal: modalOpen, playing }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
